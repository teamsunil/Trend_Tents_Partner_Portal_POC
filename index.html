<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Tents — Partner Management System (POC)</title>
<!--
  Trend Tents Dropshipping Partner Management System — working proof of concept
  HOW TO RUN: open this file in a modern browser (Chrome, Edge, Firefox, Safari). No server, build step or API keys.
  DEMO: choose Admin or Partner on the sign-in screen, then use "Demo walkthrough" in the top bar.
  Demo email OTP code: 123456. Data persists in this browser's localStorage; use "Reset demo data" to restart.
  All email, Xero and sign-in behaviour is SIMULATED. All figures are sample data.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231C2B3A'/%3E%3Cpath d='M16 5 L28 26 H4 Z' fill='none' stroke='%23D47E0C' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1C2B3A; --navy-2:#243A4F; --navy-3:#2E4860; --navy-deep:#15212D;
  --orange:#D47E0C; --orange-ink:#94560A; --orange-soft:#FBF0E1; --orange-line:#EDC892;
  --canvas:#EDF0F3; --surface:#FFFFFF; --surface-2:#F6F8FA; --line:#D8DEE4; --line-2:#E7EBEF;
  --text:#21303E; --muted:#5A6A79; --faint:#8695A3;
  --green:#17693F; --green-bg:#E3F3EA; --red:#AF2318; --red-bg:#FCEAE8;
  --amber:#8A4F05; --amber-bg:#FCF1DE; --blue:#1B5687; --blue-bg:#E5EEF7; --grey-bg:#EEF1F4;
  --r-lg:10px; --r:6px;
  --shadow:0 1px 2px rgba(28,43,58,.06),0 2px 8px rgba(28,43,58,.05);
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-head:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.5;color:var(--text);background:var(--canvas);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-head);color:var(--navy);margin:0;line-height:1.2;font-weight:600}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1.05rem}
p{margin:0 0 .6em}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.nowrap{white-space:nowrap}
.mt{margin-top:16px}.mt-s{margin-top:8px}.mb{margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--surface)}
.login-brand{background:var(--navy);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-brand img{width:250px;max-width:70%;position:relative;z-index:1}
.login-brand .lines{position:absolute;inset:auto -40px -10px auto;width:min(640px,90%);opacity:.9}
.login-brand h1{color:#fff;font-size:2.3rem;max-width:15ch;position:relative;z-index:1;font-weight:500}
.login-brand p{color:#C5D1DC;max-width:44ch;position:relative;z-index:1}
.login-panel{padding:48px;display:flex;flex-direction:column;justify-content:center;max-width:520px}
.login-panel h2{font-size:1.5rem;margin-bottom:6px}
.role-card{display:flex;gap:16px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:18px;margin-top:14px;cursor:pointer}
.role-card:hover{border-color:var(--orange);background:var(--orange-soft)}
.role-card strong{font-family:var(--font-head);font-size:1.15rem;color:var(--navy);display:block}
.role-icon{flex:none;width:44px;height:44px;border-radius:var(--r);background:var(--navy);display:grid;place-items:center;color:var(--orange)}
.demo-note{margin-top:22px;padding:12px 14px;border-left:3px solid var(--orange);background:var(--surface-2);font-size:.88rem;color:var(--muted)}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--navy);color:#D3DCE5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand{padding:14px 18px 10px;border-bottom:1px solid rgba(255,255,255,.07)}
.sidebar .brand img{width:180px;display:block}
.sidebar .portal-label{font-size:.8rem;color:#8FA2B4;margin-top:2px;padding-left:4px}
.nav{padding:12px 10px;flex:1}
.nav-group{font-size:.76rem;color:#7E93A7;padding:14px 12px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:#D3DCE5;padding:9px 12px;border-radius:var(--r);cursor:pointer;text-align:left;position:relative;font-size:.95rem}
.nav button:hover{background:var(--navy-2);color:#fff}
.nav button.active{background:var(--navy-3);color:#fff;font-weight:600}
.nav button.active::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:5px;background:var(--orange);clip-path:polygon(0 0,100% 18%,100% 82%,0 100%)}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav .count{margin-left:auto;background:var(--orange);color:#1C2B3A;font-size:.72rem;font-weight:700;border-radius:999px;padding:0 7px;line-height:18px}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:.8rem;color:#8FA2B4}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:1.25rem}
.topbar .crumb{font-size:.82rem;color:var(--muted)}
.menu-btn{display:none}
.icon-btn{position:relative;width:38px;height:38px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--navy)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;background:var(--orange);color:var(--navy);font-size:.7rem;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.user-chip{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.78rem;font-weight:700}
.user-chip .who{line-height:1.15;font-size:.85rem}
.user-chip .who small{display:block;color:var(--muted);font-size:.74rem}
.demo-bar{background:var(--navy-deep);color:#C9D4DE;font-size:.82rem;padding:6px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo-bar strong{color:var(--orange)}
.demo-bar button,.demo-bar select{background:transparent;border:1px solid #3B5269;color:#fff;border-radius:4px;padding:2px 8px;font-size:.8rem;cursor:pointer}
.demo-bar select option{color:#000}
.content{padding:24px;max-width:1480px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:75ch}

/* ---------- Components ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--navy);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.accent{background:var(--orange);border-color:var(--orange);color:var(--navy)}
.btn.accent:hover{background:#E08A17}
.btn.danger{color:var(--red);border-color:#EBC3BF}
.btn.danger:hover{background:var(--red-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link-btn{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-body{padding:18px}
.panel-body.flush{padding:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 14px 18px;position:relative;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.kpi::before{content:"";position:absolute;left:0;top:14px;width:4px;height:26px;background:var(--line);border-radius:0 3px 3px 0}
.kpi.warn::before{background:var(--orange)} .kpi.bad::before{background:var(--red)} .kpi.ok::before{background:var(--green)}
.kpi:hover{border-color:#B8C4CF}
.kpi .label{font-size:.85rem;color:var(--muted)}
.kpi .value{font-family:var(--font-head);font-size:1.75rem;font-weight:600;color:var(--navy);line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.78rem;color:var(--faint)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFBFC}
td .actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.cell-strong{font-weight:600;color:var(--navy)}
.cell-sub{display:block;font-size:.78rem;color:var(--muted)}
.prod-thumb{width:46px;height:36px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-2);object-fit:cover;flex:none}

.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--grey-bg);color:var(--muted)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-green{background:var(--green-bg);color:var(--green)} .b-red{background:var(--red-bg);color:var(--red)}
.b-amber{background:var(--amber-bg);color:var(--amber)} .b-blue{background:var(--blue-bg);color:var(--blue)}
.b-navy{background:#E3E8EE;color:var(--navy)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--orange-ink);background:var(--orange-soft);border:1px solid var(--orange-line);border-radius:4px;padding:0 6px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line-2)}
.toolbar .search{position:relative;flex:1;min-width:200px;max-width:340px}
.toolbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;color:var(--faint)}
.toolbar .search input{padding-left:32px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.active{color:var(--navy);border-bottom-color:var(--orange)}
.tabs .count{background:var(--grey-bg);border-radius:999px;padding:0 7px;font-size:.75rem;margin-left:4px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label,.label{font-size:.85rem;font-weight:600;color:var(--navy)}
.field .hint{font-size:.78rem;color:var(--muted)}
.field .err{font-size:.8rem;color:var(--red);display:none}
.field.invalid .err{display:block}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red)}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=tel],input[type=url],input[type=search],select,textarea{width:100%;border:1px solid #C6CFD8;border-radius:var(--r);padding:8px 10px;background:#fff;min-height:38px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--navy);outline:2px solid rgba(212,126,12,.35);outline-offset:0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.form-grid .full{grid-column:1/-1}
.check{display:flex;gap:9px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:4px;accent-color:var(--navy)}

.callout{border-radius:var(--r);padding:11px 14px;font-size:.88rem;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.callout svg{width:18px;height:18px;flex:none;margin-top:1px}
.callout.info{background:var(--blue-bg);border-color:#C7D9EA;color:#18466C}
.callout.warn{background:var(--amber-bg);border-color:var(--orange-line);color:#6B3D04}
.callout.bad{background:var(--red-bg);border-color:#F0C4C0;color:#8A1B12}
.callout.ok{background:var(--green-bg);border-color:#BFE0CD;color:#125232}
.callout.demo{background:var(--surface-2);border-color:var(--line);color:var(--muted)}

.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.9rem;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:500}
.stat-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:.9rem}
.stat-line:last-child{border-bottom:0}
.meter{height:8px;border-radius:999px;background:var(--grey-bg);overflow:hidden;display:flex}
.meter span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--line);margin-bottom:6px}
.list-item{display:flex;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.list-item:last-child{border-bottom:0}
.list-item .when{margin-left:auto;font-size:.78rem;color:var(--faint);white-space:nowrap}
.unread{background:#FFFAF2}
.pip{width:8px;height:8px;border-radius:50%;background:var(--orange);margin-top:7px;flex:none}
.pip.read{background:var(--line)}

/* catalogue */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.cat-card .img{aspect-ratio:16/10;background:#E9EEF2;display:block;width:100%;object-fit:cover}
.cat-card .body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.cat-card .figs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-2);border-radius:var(--r)}
.cat-card .figs div{padding:8px 10px;border-right:1px solid var(--line-2)}
.cat-card .figs div:last-child{border-right:0}
.cat-card .figs b{display:block;font-family:var(--font-head);font-size:1.25rem;color:var(--navy)}
.cat-card .figs span{font-size:.74rem;color:var(--muted)}
.specs{font-size:.84rem;margin:0;padding:0;list-style:none;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.specs dt{color:var(--muted)} .specs dd{margin:0}

/* timeline */
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 24px;font-size:.88rem}
.timeline li::before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--line);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.timeline li.done::before{background:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.timeline li::after{content:"";position:absolute;left:9px;top:18px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(21,33,45,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:560px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:pop .16s ease-out}
.modal.lg{max-width:820px} .modal.xl{max-width:1000px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}

.otp-input{font-family:var(--font-head);font-size:1.8rem;letter-spacing:.5em;text-align:center;padding:10px!important;font-variant-numeric:tabular-nums}
.otp-code{font-family:var(--font-head);font-size:1.2rem;letter-spacing:.2em;color:var(--navy);background:#fff;border:1px dashed var(--orange);padding:2px 8px;border-radius:4px}

/* dropdowns */
.dropdown{position:absolute;right:24px;top:58px;width:380px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 12px 32px rgba(0,0,0,.16);z-index:60;max-height:70vh;display:flex;flex-direction:column}
.dropdown .scroll{overflow-y:auto}

/* toasts */
.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:380px}
.toast{background:var(--navy);color:#fff;padding:11px 14px;border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:.9rem;display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--orange)}
.toast.error{border-left-color:#F06A5E}
.toast.success{border-left-color:#4CC38A}

/* guide drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;background:var(--surface);z-index:90;box-shadow:-12px 0 32px rgba(0,0,0,.15);display:flex;flex-direction:column}
.drawer .scroll{overflow-y:auto;padding:8px 0}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;gap:12px;padding:10px 20px;align-items:flex-start;border-bottom:1px solid var(--line-2);counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center}
.steps li .who{font-size:.72rem;font-weight:700;color:var(--orange-ink)}

/* document (invoice/statement) */
.doc{background:#fff;color:#1d2a36;font-size:.88rem}
.doc-head{display:flex;justify-content:space-between;gap:20px;background:var(--navy);color:#fff;padding:18px 22px;border-radius:var(--r) var(--r) 0 0;align-items:center}
.doc-head img{width:170px;display:block}
.doc-head .t{text-align:right}
.doc-head .t h2{color:#fff;font-size:1.5rem}
.doc-head .t div{color:#C5D1DC;font-size:.85rem}
.doc-stripe{height:4px;background:var(--orange)}
.doc-body{padding:20px 22px;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r)}
.doc-parties{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:18px}
.doc-parties h4{font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:4px;font-family:var(--font)}
.doc table th{background:#F1F4F7}
.doc .totals{margin-left:auto;width:min(340px,100%);margin-top:12px}
.doc .totals .stat-line.total{font-weight:700;font-size:1rem;border-top:2px solid var(--navy);border-bottom:0;padding-top:9px;color:var(--navy)}
.doc-foot{margin-top:18px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line-2);padding-top:10px}

#printRoot{display:none}
@media print{
  body.printing > *:not(#printRoot){display:none!important}
  body.printing #printRoot{display:block}
  body{background:#fff}
  .doc-head{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc-stripe,.badge{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:.86rem}
.bar-track{height:14px;background:var(--grey-bg);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--navy)}
.bar-fill.o{background:var(--orange)}

.overlay{display:none}
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr 1fr}
}
@media (max-width:920px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:80;transform:translateX(-100%);transition:transform .2s}
  .shell.nav-open .sidebar{transform:none}
  .shell.nav-open .overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:70}
  .menu-btn{display:grid}
  .g2,.g3,.g-2-1{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}
  .login-brand{padding:32px;min-height:280px}
  .login-panel{padding:32px;max-width:none}
  .doc-parties{grid-template-columns:1fr}
}
@media (max-width:600px){
  .content{padding:16px}
  .topbar{padding:0 14px}
  .topbar .crumb,.user-chip .who{display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .value{font-size:1.4rem}
  .form-grid{grid-template-columns:1fr}
  .bar-row{grid-template-columns:90px 1fr 70px}
  .demo-bar{padding:6px 14px}
}
.demo-bar select{width:auto;min-height:0;max-width:260px}
.user-chip svg,.icon-btn svg{width:18px;height:18px;flex:none}
.user-chip > svg{color:var(--muted);width:16px;height:16px}
.toast svg{width:18px;height:18px;flex:none;margin-top:2px}
.cell-strong{white-space:nowrap}
.list-item svg{width:18px;height:18px}
.top-title{font-family:var(--font-head);font-weight:600;color:var(--navy);font-size:1.1rem;line-height:1.2}
.doc td{white-space:nowrap}.doc td.wrap{white-space:normal;min-width:170px}
@media (max-width:600px){.demo-bar .demo-text{display:none}}
.login-brand h1{margin-bottom:12px}.login-brand .lines{opacity:.5}.login-brand img{width:210px}

</style>
</head>

/* ---------- state ---------- */
let S;
const UI = { page: 'dashboard', tab: {}, filters: {}, notifOpen: false, guideOpen: false, navOpen: false, detail: null, selectedOrders: new Set() };
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { S = JSON.parse(raw); if (S.version === 1) return; } } catch (e) { /* storage blocked or corrupt */ }
  S = seed(); save();
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { console.warn('Demo persistence unavailable', e); } }
function resetDemo() { S = seed(); S.session.role = null; save(); UI.page = 'dashboard'; UI.selectedOrders.clear(); render(); toast('Demo data reset to the seeded scenario', 'success'); }

/* ---------- lookups ---------- */
const product = id => S.products.find(p => p.id === id);
const partner = id => S.partners.find(p => p.id === id);
const order = id => S.orders.find(o => o.id === id);
const invoice = id => S.invoices.find(i => i.id === id);
const isAdmin = () => S.session.role === 'admin';
const me = () => partner(S.session.partnerId);
const actor = () => isAdmin() ? 'Admin (Trend Tents)' : me().name;
const ACTIVE_ORDER = ['Pending Review', 'Awaiting Dispatch', 'Partially Dispatched'];

/* ---------- inventory maths ---------- */
const dispatchedQty = o => sum(o.dispatches, d => d.qty);
const outstandingQty = o => ACTIVE_ORDER.includes(o.status) ? o.qty - dispatchedQty(o) : 0;
function allocStats(pid, prodId) {
  const al = S.allocations.find(a => a.partnerId === pid && a.productId === prodId);
  const os = S.orders.filter(o => o.partnerId === pid && o.productId === prodId);
  const allocated = al ? al.allocated : 0;
  const consumed = sum(os, dispatchedQty);
  const reserved = sum(os, outstandingQty);
  return { al, allocated, consumed, reserved, remaining: Math.max(0, allocated - consumed - reserved) };
}
function productStats(p) {
  const reserved = sum(S.orders.filter(o => o.productId === p.id), outstandingQty);
  const allocs = S.allocations.filter(a => a.productId === p.id);
  const remainingAlloc = sum(allocs, a => allocStats(a.partnerId, p.id).remaining);
  const unallocated = p.physical - p.damaged - reserved - remainingAlloc;
  return { reserved, remainingAlloc, unallocated, sellable: p.physical - p.damaged };
}
function totals() {
  const t = { physical: 0, damaged: 0, reserved: 0, remainingAlloc: 0, unallocated: 0, incoming: 0 };
  S.products.forEach(p => { const st = productStats(p); t.physical += p.physical; t.damaged += p.damaged; t.reserved += st.reserved; t.remainingAlloc += st.remainingAlloc; t.unallocated += st.unallocated; t.incoming += p.incoming; });
  return t;
}

/* ---------- money ---------- */
function orderMoney(o, qty = o.qty) {
  const value = round2(o.unitPrice * qty);
  const commission = round2(value * o.commissionRate / 100);
  const shipping = qty > 0 ? S.settings.shippingPerOrder : 0;
  const sub = round2(value - commission + shipping);
  const vat = S.settings.vatEnabled ? round2(sub * S.settings.vatRate / 100) : 0;
  return { value, commission, shipping, sub, vat, payable: round2(sub + vat) };
}
function buildInvoice(st, pid, orderIds, date, due) {
  const lines = orderIds.map(id => {
    const o = st.orders.find(x => x.id === id), p = st.products.find(x => x.id === o.productId);
    const q = sum(o.dispatches, d => d.qty);
    const value = round2(o.unitPrice * q), commission = round2(value * o.commissionRate / 100);
    return { orderId: o.id, ref: o.ref, sku: p.sku, product: p.name, qty: q, unitPrice: o.unitPrice, value, commissionRate: o.commissionRate, commission, shipping: st.settings.shippingPerOrder, dispatchDate: o.dispatches.length ? o.dispatches[o.dispatches.length - 1].date : '' };
  });
  const value = sum(lines, l => l.value), commission = sum(lines, l => l.commission), shipping = sum(lines, l => l.shipping);
  const sub = round2(value - commission + shipping);
  const vat = st.settings.vatEnabled ? round2(sub * st.settings.vatRate / 100) : 0;
  return { id: '', number: '', partnerId: pid, orderIds, lines, date, due, treatment: st.settings.treatment, vatRate: st.settings.vatEnabled ? st.settings.vatRate : 0,
    value: round2(value), commission: round2(commission), shipping: round2(shipping), sub, vat, total: round2(sub + vat), manualOverdue: false, xero: { number: '', url: '', status: '' }, notes: '' };
}
const invPaid = inv => round2(sum(S.payments.filter(p => p.invoiceId === inv.id), p => p.amount));
const invCredited = inv => round2(sum(S.credits.filter(c => c.invoiceId === inv.id), c => c.amount));
const invBalance = inv => round2(inv.total - invPaid(inv) - invCredited(inv));
function invStatus(inv) {
  const bal = invBalance(inv), paid = invPaid(inv), cr = invCredited(inv);
  if (bal <= 0.004) return cr > 0 && paid < inv.total ? 'Credited' : 'Paid';
  if (inv.manualOverdue || inv.due < todayISO()) return 'Overdue';
  if (paid > 0 || cr > 0) return 'Partially Paid';
  return 'Issued';
}
function partnerFinance(pid) {
  const p = partner(pid);
  const invs = S.invoices.filter(i => i.partnerId === pid);
  const outstanding = round2(sum(invs, i => Math.max(0, invBalance(i))));
  const overdueInvs = invs.filter(i => invStatus(i) === 'Overdue');
  const overdue = round2(sum(overdueInvs, invBalance));
  const unapplied = round2(sum(S.credits.filter(c => c.partnerId === pid && !c.invoiceId), c => c.amount));
  const os = S.orders.filter(o => o.partnerId === pid);
  const uninvoiced = os.filter(o => !o.invoiceId && dispatchedQty(o) > 0 && o.status !== 'Cancelled');
  const uninvoicedAmt = round2(sum(uninvoiced, o => orderMoney(o, dispatchedQty(o)).payable));
  const awaiting = os.filter(o => ['Awaiting Dispatch', 'Partially Dispatched'].includes(o.status));
  const awaitingAmt = round2(sum(awaiting, o => orderMoney(o, outstandingQty(o)).payable));
  const exposure = round2(outstanding + uninvoicedAmt + awaitingAmt - unapplied);
  const nextDue = invs.filter(i => invBalance(i) > 0).map(i => i.due).sort()[0] || '';
  return { outstanding, overdue, overdueInvs, unapplied, uninvoiced, uninvoicedAmt, awaiting, awaitingAmt, exposure, limit: p.creditLimit, available: round2(p.creditLimit - exposure), nextDue, invs };
}
function creditCheck(o) {
  const f = partnerFinance(o.partnerId);
  const add = orderMoney(o, outstandingQty(o)).payable;
  const after = round2(f.exposure + add);
  const overLimit = after > f.limit, hasOverdue = f.overdue > 0;
  return { ...f, add, after, overLimit, hasOverdue, blocked: S.settings.creditBlock && (overLimit || hasOverdue) };
}

let modalStack = [];
function openModal({ title, body, foot = '', size = '', onMount }) {
  const root = $('#modalRoot');

  const wrap = document.createElement('div'); wrap.className = 'modal-backdrop'; wrap.dataset.modal = id;

  wrap.addEventListener('mousedown', e => { if (e.target === wrap) closeModal(); });
  root.appendChild(wrap); modalStack.push({ id, prevFocus: document.activeElement });
  const f = wrap.querySelector('input:not([type=hidden]):not([disabled]),select,textarea,button:not([data-act=closeModal])'); if (f) f.focus();
  if (onMount) onMount(wrap);
  return wrap;
}
function closeModal() {
  const top = modalStack.pop(); if (!top) return;
  const el = document.querySelector(`[data-modal="${top.id}"]`); if (el) el.remove();
  if (top.cleanup) top.cleanup();
  if (top.prevFocus && document.body.contains(top.prevFocus)) top.prevFocus.focus();
}
function closeAllModals() { while (modalStack.length) closeModal(); }

/* ---------- form validation ---------- */
function validate(form, rules) {
  let ok = true;
  $$('.field', form).forEach(f => f.classList.remove('invalid'));
  for (const [name, test, msg] of rules) {
    const el = form.elements[name]; if (!el) continue;
    const res = test(el.value.trim(), el);
    if (res !== true) {
      ok = false; const f = el.closest('.field');
      if (f) { f.classList.add('invalid'); let e = f.querySelector('.err'); if (!e) { e = document.createElement('div'); e.className = 'err'; f.appendChild(e); } e.textContent = typeof res === 'string' ? res : msg; }
    }
  }
  if (!ok) { const first = form.querySelector('.invalid input,.invalid select,.invalid textarea'); if (first) first.focus(); }
  return ok;
}

/* ---------- email OTP (simulated) ---------- */
function requireOtp(purpose, email, onSuccess) {
  const st = { expires: Date.now() + 5 * 60000, attempts: 0, max: 3, resendAt: Date.now() + 30000, timer: null, sends: 1 };
  const masked = email.replace(/^(.)(.*)(@.*)$/, (m, a, b, c) => a + '•'.repeat(Math.min(6, b.length)) + c);
  const w = openModal({
    title: 'Verify with email code',
    body: `<p>To confirm <strong>${esc(purpose)}</strong>, enter the 6-digit code that would be sent to <strong>${esc(masked)}</strong>.</p>
      ${callout('demo', `<strong>Simulated email — nothing has been sent.</strong> This proof of concept has no email service. Use the demo code <span class="otp-code">${DEMO_OTP}</span>. In production the code is generated, emailed and checked on the server.`, 'mail')}
      <div class="field mt"><label for="otpIn">Verification code</label><input id="otpIn" class="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"><div class="err" id="otpErr"></div></div>
      <div class="row between small"><span id="otpTimer" class="muted"></span><button class="link-btn" id="otpResend" type="button">Resend code</button></div>
      <div class="tiny muted mt-s">Codes expire after 5 minutes. After 3 incorrect attempts you will need a new code.</div>`,
    foot: `<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" id="otpVerify">Verify and submit</button>`
  });
  const inEl = w.querySelector('#otpIn'), err = w.querySelector('#otpErr'), fieldEl = inEl.closest('.field'), verify = w.querySelector('#otpVerify'), resend = w.querySelector('#otpResend'), timerEl = w.querySelector('#otpTimer');
  const showErr = m => { fieldEl.classList.add('invalid'); err.textContent = m; };
  const tick = () => {
    const left = Math.max(0, st.expires - Date.now()), r = Math.max(0, st.resendAt - Date.now());
    const mm = Math.floor(left / 60000), ss = String(Math.floor(left / 1000) % 60).padStart(2, '0');
    timerEl.textContent = left > 0 ? `Code expires in ${mm}:${ss}` : 'Code expired — request a new one.';
    resend.disabled = r > 0; resend.textContent = r > 0 ? `Resend code (${Math.ceil(r / 1000)}s)` : 'Resend code';
    resend.style.opacity = r > 0 ? .5 : 1;
    if (left <= 0) { verify.disabled = true; }
  };
  st.timer = setInterval(tick, 500); tick();
  modalStack[modalStack.length - 1].cleanup = () => clearInterval(st.timer);
  inEl.addEventListener('input', () => { inEl.value = inEl.value.replace(/\D/g, ''); fieldEl.classList.remove('invalid'); });
  inEl.addEventListener('keydown', e => { if (e.key === 'Enter') verify.click(); });
  resend.addEventListener('click', () => {
    if (Date.now() < st.resendAt) return;
    st.expires = Date.now() + 5 * 60000; st.attempts = 0; st.resendAt = Date.now() + 30000; st.sends++;
    verify.disabled = false; inEl.disabled = false; inEl.value = ''; fieldEl.classList.remove('invalid'); inEl.focus();
    toast(`New demo code issued (simulated — no email sent). Use ${DEMO_OTP}.`);
  });
  verify.addEventListener('click', () => {
    if (Date.now() > st.expires) return showErr('This code has expired. Request a new code.');
    if (st.attempts >= st.max) return showErr('Too many incorrect attempts. Request a new code.');
    if (!/^\d{6}$/.test(inEl.value)) return showErr('Enter all 6 digits.');
    verify.disabled = true; verify.textContent = 'Verifying…';
    setTimeout(() => {
      if (inEl.value !== DEMO_OTP) {
        st.attempts++; verify.textContent = 'Verify and submit';
        if (st.attempts >= st.max) { inEl.disabled = true; showErr('Too many incorrect attempts. Request a new code to continue.'); }
        else { verify.disabled = false; showErr(`That code is incorrect. ${st.max - st.attempts} attempt${st.max - st.attempts === 1 ? '' : 's'} left.`); inEl.select(); }
        return;
      }
      closeModal(); onSuccess();
    }, 450);
  });
}

    onSubmit: (form, v) => {

        ['price', x => x !== '' && +x >= 0, 'Enter a price of £0 or more.'], ['incoming', x => /^\d+$/.test(x), 'Enter a whole number.'], ['incomingDate', (x) => +form.elements.incoming.value > 0 && !x ? 'Add an expected arrival date for incoming stock.' : true],

      };
      if (file) {
        if (file.size > 400 * 1024) { toast('That image is over 400 KB. Choose a smaller file.', 'error'); return false; }

A.receiveStock = d => {

  formModal({ title: 'Record stock received', submitLabel: 'Confirm receipt', body: `
    <p><strong>${esc(p.name)}</strong> · ${p.sku}<br><span class="small muted">Currently ${p.physical} physical, ${p.incoming} expected incoming.</span></p>
    <div class="form-grid">${field('qty', 'Quantity received', inp('qty', 'number', p.incoming || '', 'min="1"'))}${field('date', 'Receipt date', inp('date', 'date', todayISO(), `max="${todayISO()}"`))}
    ${field('ref', 'Delivery / container reference', inp('ref', 'text', '', 'placeholder="e.g. TTC-2311"'), '', 'full')}</div>
    ${p.incoming ? `<label class="check mb"><input type="checkbox" name="deduct" checked> Deduct from expected incoming (${p.incoming})</label>` : ''}
    <div class="field"><label class="check"><input type="checkbox" name="confirm" id="in-confirm"> I confirm these goods have been physically received, counted and checked into the warehouse.</label><div class="err"></div></div>`,
    onSubmit: (form, v) => {
      if (!validate(form, [['qty', posInt, 'Enter a whole number above zero.'], ['ref', req, 'Enter the delivery reference.'], ['date', x => x && x <= todayISO(), 'Receipt date cannot be in the future.'], ['confirm', (x, el) => el.checked, 'Warehouse receipt must be confirmed before stock becomes available.']])) return false;
      const q = +v.qty; p.physical += q; if (v.deduct) { p.incoming = Math.max(0, p.incoming - q); if (!p.incoming) p.incomingDate = ''; }
      if (p.status === 'Awaiting Receipt') p.status = 'Available';
      movement(p.id, 'Stock received', q, `${v.ref} — receipt confirmed ${fmtDate(v.date)}`); audit('Stock received', `${p.sku} +${q} (${v.ref})`);
      closeAllModals(); commit(`${q} units of ${p.name} received and now available to allocate`); return false;
    } });
};

A.adjustStock = d => {
  const p = product(d.id), st = productStats(p);
  const types = [['damage', 'Mark sellable stock as unsellable / damaged'], ['restore', 'Restore unsellable stock to sellable'], ['writeoff', 'Write off unsellable stock (removes from physical)'], ['countUp', 'Count correction: increase physical'], ['countDown', 'Count correction: decrease physical']];
  formModal({ title: 'Record stock adjustment', submitLabel: 'Record adjustment', body: `
    <p><strong>${esc(p.name)}</strong><br><span class="small muted">Physical ${p.physical} · unsellable ${p.damaged} · unallocated ${st.unallocated}</span></p>
    ${field('type', 'Adjustment type', sel('type', types.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')))}
    ${field('qty', 'Quantity', inp('qty', 'number', '', 'min="1"'), 'Reductions to sellable stock are limited to unallocated quantity, so partner allocations and reservations are never oversold.')}
    ${field('reason', 'Reason', ta('reason', '', 'placeholder="e.g. Water damage found during cycle count"'))}`,
    onSubmit: (form, v) => {
      if (!validate(form, [['qty', posInt, 'Enter a whole number above zero.'], ['reason', req, 'Give a reason for the audit trail.']])) return false;
      const q = +v.qty; let delta = 0, label = '';
      const fail = m => { const f = form.elements.qty.closest('.field'); f.classList.add('invalid'); f.querySelector('.err').textContent = m; return false; };
      if (v.type === 'damage') { if (q > st.unallocated) return fail(`Only ${st.unallocated} unallocated units can be marked unsellable. Withdraw allocations first.`); p.damaged += q; label = 'Marked unsellable'; delta = -q; }
      if (v.type === 'restore') { if (q > p.damaged) return fail(`Only ${p.damaged} units are unsellable.`); p.damaged -= q; label = 'Restored to sellable'; delta = q; }
      if (v.type === 'writeoff') { if (q > p.damaged) return fail(`Only ${p.damaged} unsellable units can be written off.`); p.damaged -= q; p.physical -= q; label = 'Written off'; delta = -q; }
      if (v.type === 'countUp') { p.physical += q; label = 'Count correction'; delta = q; }
      if (v.type === 'countDown') { if (q > st.unallocated) return fail(`Only ${st.unallocated} unallocated units can be removed without affecting partner allocations.`); p.physical -= q; label = 'Count correction'; delta = -q; }
      movement(p.id, label, delta, v.reason); audit('Stock adjustment', `${p.sku} ${label} ${delta > 0 ? '+' : ''}${delta}: ${v.reason}`);
      closeAllModals(); commit('Stock adjustment recorded'); return false;
    } });
};

/* ---------- Stock allocations ---------- */
function allocTable(allocs) {
  return table([
    { h: 'Partner', v: a => `<span class="cell-strong">${esc(partner(a.partnerId).name)}</span><span class="cell-sub">${a.id}</span>` },
    { h: 'Product', v: a => prodCell(product(a.productId)) },
    { h: 'Allocated', num: 1, v: a => allocStats(a.partnerId, a.productId).allocated },
    { h: 'Dispatched', num: 1, v: a => allocStats(a.partnerId, a.productId).consumed },
    { h: 'Reserved for orders', num: 1, v: a => allocStats(a.partnerId, a.productId).reserved },
    { h: 'Remaining available', num: 1, v: a => `<strong>${allocStats(a.partnerId, a.productId).remaining}</strong>` },
    { h: 'Allocated on', v: a => fmtDate(a.date) },
    { h: 'Status', v: a => badge(allocStats(a.partnerId, a.productId).allocated === 0 ? 'Withdrawn' : a.status) },
    { h: '', v: a => `<div class="actions"><button class="btn sm" data-act="adjustAllocation" data-id="${a.id}">Adjust</button><button class="btn sm danger" data-act="withdrawAllocation" data-id="${a.id}" ${allocStats(a.partnerId, a.productId).remaining ? '' : 'disabled'}>Withdraw</button></div>` }
  ], allocs, 'No allocations yet.');
}
ADMIN_PAGES.allocations = () => {
  const pend = S.allocRequests.filter(r => r.status === 'Pending');
  const tb = tabs('alloc', [['list', 'Allocations', S.allocations.length], ['req', 'Allocation requests', pend.length]]);
  let body;
  if (tb.cur === 'list') {
    const pf = fval('alPartner'), prf = fval('alProd');
    const rows = S.allocations.filter(a => (!pf || a.partnerId === pf) && (!prf || a.productId === prf));
    body = `<section class="panel"><div class="toolbar">${selectFilter('alPartner', 'Partner', partnerOpts())}${selectFilter('alProd', 'Product', [['', 'All products'], ...S.products.map(p => [p.id, p.name])])}<span class="grow"></span><button class="btn primary" data-act="newAllocation">${icon('plus')}Allocate stock</button></div>${allocTable(rows)}</section>`;
  } else {
    body = `<section class="panel">${table([
      { h: 'Request', v: r => `<span class="cell-strong">${r.id}</span><span class="cell-sub">${fmtDateTime(r.date)}</span>` },
      { h: 'Partner', v: r => esc(partner(r.partnerId).name) },
      { h: 'Product', v: r => esc(product(r.productId).name) },
      { h: 'Qty', num: 1, v: r => r.qty + (r.approvedQty != null && r.approvedQty !== r.qty ? `<span class="cell-sub">${r.approvedQty} approved</span>` : '') },
      { h: 'Unallocated now', num: 1, v: r => productStats(product(r.productId)).unallocated },
      { h: 'Reason', v: r => `<span class="small">${esc(r.reason)}</span>${r.decisionNote ? `<span class="cell-sub">Decision: ${esc(r.decisionNote)}</span>` : ''}` },
      { h: 'Status', v: r => badge(r.status) },
      { h: '', v: r => r.status === 'Pending' ? `<div class="actions"><button class="btn sm primary" data-act="approveAllocReq" data-id="${r.id}">Approve</button><button class="btn sm danger" data-act="rejectAllocReq" data-id="${r.id}">Reject</button></div>` : '' }
    ], [...S.allocRequests].sort((a, b) => b.date.localeCompare(a.date)), 'No allocation requests.')}</section>`;
  }
  return `<div class="page-head"><div><h1>Stock Allocations</h1><p>Reserve warehouse stock for a partner to sell on their own website.</p></div></div>
  ${callout('info', '<strong>An allocation is not a purchase.</strong> It does not transfer ownership or create a payment. Trend Tents keeps the stock until it is dispatched to the partner\'s customer; settlement happens monthly on dispatched orders.')}<div class="mt"></div>${tb.html}${body}`;
};
A.newAllocation = d => {
  formModal({ title: 'Allocate stock to a partner', submitLabel: 'Create allocation', body: `
    ${callout('info', 'Allocating stock does not trigger a purchase or payment.')}
    <div class="mt">${field('partnerId', 'Partner', sel('partnerId', S.partners.filter(p => p.status !== 'Deactivated').map(p => `<option value="${p.id}" ${d.partner === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')))}
    ${field('productId', 'Product', sel('productId', S.products.filter(p => p.status !== 'Discontinued').map(p => `<option value="${p.id}" ${d.product === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')))}
    ${field('qty', 'Quantity to allocate', inp('qty', 'number', d.qty || '', 'min="1"'), '<span id="allocHint"></span>')}</div>`,
    onMount: form => { const upd = () => { const p = product(form.elements.productId.value), st = productStats(p), as = allocStats(form.elements.partnerId.value, p.id); form.querySelector('#allocHint').innerHTML = `<strong>${st.unallocated}</strong> unallocated available. This partner currently has ${as.remaining} remaining${as.reserved ? ` and ${as.reserved} reserved` : ''}.`; }; form.addEventListener('change', upd); upd(); },
    onSubmit: (form, v) => {
      const p = product(v.productId), st = productStats(p);
      if (!validate(form, [['qty', x => !posInt(x) ? 'Enter a whole number above zero.' : +x > st.unallocated ? `Only ${st.unallocated} units are unallocated. Allocations cannot exceed available stock.` : true]])) return false;
      doAllocate(v.partnerId, v.productId, +v.qty); closeModal(); commit(`${v.qty} × ${p.name} allocated to ${partner(v.partnerId).name}`); return false;
    } });
};
function doAllocate(pid, prodId, q, note = '') {
  let al = S.allocations.find(a => a.partnerId === pid && a.productId === prodId);
  if (al) { al.allocated += q; al.status = 'Active'; al.date = todayISO(); } else { al = { id: 'AL-' + (100 + S.allocations.length + 1) + Math.floor(Math.random() * 9), partnerId: pid, productId: prodId, allocated: q, date: todayISO(), status: 'Active' }; S.allocations.push(al); }
  audit('Allocation created', `${partner(pid).name}: +${q} × ${product(prodId).sku}${note ? ' (' + note + ')' : ''}`);
  notify(pid, `${q} × ${product(prodId).name} added to your allocation`, { page: 'myallocations' });
}
A.adjustAllocation = d => {
  const al = S.allocations.find(a => a.id === d.id), s = allocStats(al.partnerId, al.productId), st = productStats(product(al.productId));
  const min = s.consumed + s.reserved, max = s.allocated + st.unallocated;
  formModal({ title: 'Adjust allocation', submitLabel: 'Save allocation', body: `<p><strong>${esc(partner(al.partnerId).name)}</strong> · ${esc(product(al.productId).name)}</p>
    <div class="grid g3 mb"><div class="panel panel-body"><div class="small muted">Dispatched</div><strong>${s.consumed}</strong></div><div class="panel panel-body"><div class="small muted">Reserved</div><strong>${s.reserved}</strong></div><div class="panel panel-body"><div class="small muted">Unallocated in warehouse</div><strong>${st.unallocated}</strong></div></div>
    ${field('total', 'Total allocated quantity', inp('total', 'number', s.allocated, `min="${min}" max="${max}"`), `Between ${min} (already dispatched or reserved for orders) and ${max}.`)}
    ${field('reason', 'Reason', inp('reason', 'text', ''))}`,
    onSubmit: (form, v) => {
      if (!validate(form, [['total', x => !/^\d+$/.test(x) ? 'Enter a whole number.' : +x < min ? `Cannot go below ${min}: those units are dispatched or reserved for submitted orders.` : +x > max ? `Cannot exceed ${max}: not enough unallocated stock.` : true], ['reason', req, 'Give a reason.']])) return false;
      const diff = +v.total - s.allocated; al.allocated = +v.total;
      audit('Allocation adjusted', `${partner(al.partnerId).name} ${product(al.productId).sku}: ${s.allocated} → ${v.total} (${v.reason})`);
      notify(al.partnerId, `Your allocation for ${product(al.productId).name} was ${diff >= 0 ? 'increased' : 'reduced'} by ${Math.abs(diff)}`, { page: 'myallocations' });
      closeModal(); commit('Allocation updated'); return false;
    } });
};
A.withdrawAllocation = d => {
  const al = S.allocations.find(a => a.id === d.id), s = allocStats(al.partnerId, al.productId);
  formModal({ title: 'Withdraw allocation', submitLabel: 'Withdraw', danger: true, body: `<p><strong>${esc(partner(al.partnerId).name)}</strong> · ${esc(product(al.productId).name)}</p>
    ${callout('warn', `Only unreserved quantity can be withdrawn. <strong>${s.reserved}</strong> units are reserved for submitted orders and stay with the partner.`)}
    <div class="mt">${field('qty', 'Quantity to withdraw', inp('qty', 'number', s.remaining, `min="1" max="${s.remaining}"`), `Up to ${s.remaining}. Withdrawn units return to unallocated stock.`)}${field('reason', 'Reason', inp('reason', 'text', ''))}</div>`,
    onSubmit: (form, v) => {
      if (!validate(form, [['qty', x => !posInt(x) ? 'Enter a whole number above zero.' : +x > s.remaining ? `Only ${s.remaining} unreserved units can be withdrawn.` : true], ['reason', req, 'Give a reason.']])) return false;
      al.allocated -= +v.qty; audit('Allocation withdrawn', `${partner(al.partnerId).name} ${product(al.productId).sku}: −${v.qty} (${v.reason})`);
      notify(al.partnerId, `${v.qty} × ${product(al.productId).name} withdrawn from your allocation`, { page: 'myallocations' }); closeModal(); commit(`${v.qty} units returned to unallocated stock`); return false;
    } });
};
A.approveAllocReq = d => {
  const r = S.allocRequests.find(x => x.id === d.id), st = productStats(product(r.productId));
  formModal({ title: 'Approve allocation request', submitLabel: 'Approve and allocate', body: `<p><strong>${esc(partner(r.partnerId).name)}</strong> requested <strong>${r.qty} × ${esc(product(r.productId).name)}</strong>.</p><p class="small muted">"${esc(r.reason)}"</p>
    ${field('qty', 'Quantity to allocate', inp('qty', 'number', Math.min(r.qty, st.unallocated), `min="1" max="${st.unallocated}"`), `${st.unallocated} unallocated available. You can approve part of the request.`)}${field('note', 'Note to partner (optional)', inp('note', 'text', ''))}`,
    onSubmit: (form, v) => {
      if (!validate(form, [['qty', x => !posInt(x) ? 'Enter a whole number above zero.' : +x > st.unallocated ? `Only ${st.unallocated} units are unallocated.` : true]])) return false;
      r.status = 'Approved'; r.approvedQty = +v.qty; r.decisionNote = v.note; doAllocate(r.partnerId, r.productId, +v.qty, 'request ' + r.id);
      closeModal(); commit('Request approved and stock allocated'); return false;
    } });
};
A.rejectAllocReq = d => {
  const r = S.allocRequests.find(x => x.id === d.id);
  formModal({ title: 'Reject allocation request', submitLabel: 'Reject request', danger: true, body: field('note', 'Reason shown to partner', ta('note')), onSubmit: (form, v) => {
    if (!validate(form, [['note', req, 'Give a reason for the partner.']])) return false;
    r.status = 'Rejected'; r.decisionNote = v.note; audit('Allocation request rejected', `${r.id}: ${v.note}`); notify(r.partnerId, `Allocation request ${r.id} was not approved: ${v.note}`, { page: 'requeststock' }); closeModal(); commit('Request rejected'); return false;
  } });
};

  ], rows, 'No orders match these filters.');
}

A.exportOrders = () => downloadCSV(`fulfilment-orders-${todayISO()}.csv`, [['Order', 'Partner ref', 'Partner', 'SKU', 'Qty', 'Dispatched', 'Customer', 'Postcode/town', 'Submitted', 'Status', 'Invoice'],

A.viewOrder = d => {
  const o = order(d.id), p = product(o.productId), par = partner(o.partnerId), m = orderMoney(o, o.status === 'Cancelled' ? o.qty : o.qty);
  const adm = isAdmin(); const cc = adm && ACTIVE_ORDER.includes(o.status) ? creditCheck(o) : null;
  const steps = [['Submitted & verified', true, fmtDateTime(o.date)], ['Approved for dispatch', !!o.approvedAt || dispatchedQty(o) > 0, o.approvedAt ? fmtDate(o.approvedAt) : ''], ['Dispatched', o.status === 'Dispatched', o.dispatches.length ? fmtDate(o.dispatches[o.dispatches.length - 1].date) : ''], ['Invoiced', !!o.invoiceId, o.invoiceId || '']];
  openModal({ title: `Order ${o.id} ${badge(o.status)}`, size: 'lg', body: `
    ${o.status === 'Cancelled' ? callout('bad', `<strong>Cancelled.</strong> ${esc(o.cancelReason || '')} The reserved allocation was released.`) + '<div class="mt"></div>' : ''}
    ${cc && o.status === 'Pending Review' && (cc.overLimit || cc.hasOverdue) ? callout(cc.blocked ? 'bad' : 'warn', `<strong>Credit review.</strong> ${cc.hasOverdue ? `${money(cc.overdue)} overdue on account. ` : ''}${cc.overLimit ? `Approving takes exposure to ${money(cc.after)} against a ${money(cc.limit)} limit. ` : ''}${cc.blocked ? 'An override with a reason is needed to approve.' : 'Warning only under current settings.'}`) + '<div class="mt"></div>' : ''}
    ${o.override ? callout('info', `<strong>Credit override</strong> by ${esc(o.override.by)} on ${fmtDate(o.override.at)}: ${esc(o.override.reason)} · Payment due note: ${esc(o.override.dueNote)}`) + '<div class="mt"></div>' : ''}
    <div class="grid g2">
      <div><h3 class="mb">Order</h3><dl class="dl"><dt>Partner</dt><dd>${esc(par.name)}</dd><dt>Partner ref.</dt><dd>${esc(o.ref)}</dd><dt>Product</dt><dd>${esc(p.name)} (${p.sku})</dd><dt>Quantity</dt><dd>${o.qty} ordered · ${dispatchedQty(o)} dispatched</dd><dt>Submitted</dt><dd>${fmtDateTime(o.date)}</dd><dt>Instructions</dt><dd>${esc(o.instructions || '—')}</dd><dt>Notes</dt><dd>${esc(o.notes || '—')}</dd></dl></div>
      <div><h3 class="mb">Deliver to</h3><dl class="dl"><dt>Customer</dt><dd>${esc(o.customer.name)}</dd><dt>Address</dt><dd>${esc(o.customer.address)}</dd><dt>Phone</dt><dd>${esc(o.customer.phone)}</dd></dl>
      <h3 class="mt mb">Progress</h3><ul class="timeline">${steps.map(([t, done, w]) => `<li class="${done ? 'done' : ''}"><strong>${t}</strong>${w ? ` <span class="muted small">${esc(w)}</span>` : ''}</li>`).join('')}</ul></div>
    </div>
    <h3 class="mt mb">Dispatch & tracking</h3>
    ${table([{ h: 'Date', v: x => fmtDate(x.date) }, { h: 'Carrier', v: x => esc(x.carrier) }, { h: 'Tracking number', v: x => `<strong>${esc(x.tracking)}</strong>` }, { h: 'Qty shipped', num: 1, v: x => x.qty }], o.dispatches, 'Not dispatched yet. Tracking appears here once Trend Tents records the shipment.')}
    <h3 class="mt mb">Settlement estimate ${demoTag('Illustrative')}</h3>
    <div class="panel panel-body"><div class="stat-line"><span>Order value (${o.qty} × ${money(o.unitPrice)})</span><strong>${money(m.value)}</strong></div><div class="stat-line"><span>Partner commission (${o.commissionRate}%)</span><strong>${money(-m.commission)}</strong></div><div class="stat-line"><span>Shipping charge</span><strong>${money(m.shipping)}</strong></div>${S.settings.vatEnabled ? `<div class="stat-line"><span>VAT (${S.settings.vatRate}%)</span><strong>${money(m.vat)}</strong></div>` : ''}<div class="stat-line"><span><strong>Payable to Trend Tents via monthly settlement</strong></span><strong>${money(m.payable)}</strong></div>
    <div class="tiny muted mt-s">Final amounts are fixed on the invoice. Commission treatment (${S.settings.treatment}) is awaiting confirmation.</div></div>
    ${adm ? `<h3 class="mt mb">History</h3><ul class="timeline">${(o.history || []).map(h => `<li class="done"><span class="small">${esc(h.text)}</span> <span class="muted tiny">${fmtDateTime(h.at)}</span></li>`).join('')}</ul>` : ''}`,
    foot: `<button class="btn" data-act="closeModal">Close</button>
      ${!adm && o.status === 'Pending Review' ? `<button class="btn danger" data-act="cancelOrder" data-id="${o.id}">Cancel order</button>` : ''}
      ${!adm && dispatchedQty(o) > 0 ? `<button class="btn" data-act="newReturn" data-order="${o.id}">Request return</button>` : ''}
      ${adm && ['Pending Review', 'Awaiting Dispatch'].includes(o.status) ? `<button class="btn danger" data-act="cancelOrder" data-id="${o.id}">Reject / cancel</button>` : ''}
      ${adm && o.status === 'Pending Review' ? `<button class="btn primary" data-act="approveOrder" data-id="${o.id}">Approve for dispatch</button>` : ''}
      ${adm && ['Awaiting Dispatch', 'Partially Dispatched'].includes(o.status) ? `<button class="btn primary" data-act="dispatchOrder" data-id="${o.id}">Record dispatch</button>` : ''}
      ${adm && o.status === 'Dispatched' && !o.invoiceId ? `<button class="btn primary" data-act="invoiceFromOrder" data-id="${o.id}">Create invoice</button>` : ''}
      ${o.invoiceId ? `<button class="btn" data-act="viewInvoice" data-id="${o.invoiceId}">View invoice</button>` : ''}` });
};
const orderLog = (o, text) => { (o.history = o.history || []).push({ at: nowISO(), text: text + ' — ' + actor() }); };
A.approveOrder = d => {
  const o = order(d.id); if (o.status !== 'Pending Review') return toast('This order is no longer pending review.', 'error');
  const cc = creditCheck(o);
  const doApprove = override => {
    o.status = 'Awaiting Dispatch'; o.approvedAt = todayISO(); if (override) o.override = { ...override, by: actor(), at: nowISO() }; delete o.flag;
    orderLog(o, override ? 'Approved for dispatch with credit override' : 'Approved for dispatch');
    audit('Order approved', `${o.id} (${partner(o.partnerId).name})${override ? ' — credit override: ' + override.reason : ''}`);
    notify(o.partnerId, `Order ${o.ref} approved for dispatch`, { page: 'orders' });
    closeAllModals(); commit(`${o.id} approved — now awaiting dispatch`);
  };
  if (cc.blocked) {
    formModal({ title: 'Credit override required', submitLabel: 'Override and approve', danger: true, body: `
      ${callout('bad', `<strong>${esc(partner(o.partnerId).name)} is outside its credit rules.</strong><br>${cc.hasOverdue ? `• Overdue balance: ${money(cc.overdue)}<br>` : ''}${cc.overLimit ? `• Exposure after approval: ${money(cc.after)} vs limit ${money(cc.limit)}<br>` : ''}Normal approval is blocked by the credit rule in Settings.`)}
      <div class="mt">${field('reason', 'Override reason', ta('reason', '', 'placeholder="e.g. Partner confirmed BACS payment of overdue invoice on Friday"'))}${field('dueNote', 'Payment due-date note', inp('dueNote', 'text', '', 'placeholder="e.g. Overdue balance to be cleared by 20 Oct"'))}</div>
      <p class="tiny muted">The override is recorded in the order history and audit log.</p>`,
      onSubmit: (form, v) => { if (!validate(form, [['reason', x => x.length >= 10 || 'Give a reason of at least 10 characters.'], ['dueNote', req, 'Record when payment is expected.']])) return false; doApprove({ reason: v.reason.trim(), dueNote: v.dueNote.trim() }); return false; } });
  } else {
    confirmBox(`Approve ${o.id} for dispatch?`, `<p>${o.qty} × ${esc(product(o.productId).name)} to ${esc(o.customer.name)}.</p>${cc.overLimit ? callout('warn', `Exposure after approval ${money(cc.after)} exceeds the ${money(cc.limit)} limit. Credit blocking is switched off, so this is a warning only.`) : ''}<p class="small muted">Approval does not create an invoice or mark anything as paid.</p>`, 'Approve for dispatch', () => doApprove(null));
  }
};
A.cancelOrder = d => {
  const o = order(d.id);
  formModal({ title: `Cancel order ${o.id}`, submitLabel: 'Cancel order', danger: true, body: `${callout('info', `The ${outstandingQty(o)} reserved unit${outstandingQty(o) === 1 ? '' : 's'} will be released back to ${isAdmin() ? 'the partner\'s' : 'your'} remaining allocation.`)}<div class="mt">${field('reason', 'Reason', ta('reason'))}</div>`,
    onSubmit: (form, v) => {
      if (!validate(form, [['reason', req, 'Give a reason for cancelling.']])) return false;
      if (dispatchedQty(o) > 0) { toast('Orders with dispatched items cannot be cancelled.', 'error'); return false; }
      o.status = 'Cancelled'; o.cancelReason = v.reason.trim(); orderLog(o, 'Cancelled: ' + o.cancelReason);
      audit('Order cancelled', `${o.id}: ${o.cancelReason}`);
      if (isAdmin()) notify(o.partnerId, `Order ${o.ref} was cancelled: ${o.cancelReason}`, { page: 'orders' }); else notify('admin', `${me().name} cancelled order ${o.ref}`, { page: 'orders' });
      closeAllModals(); commit(`${o.id} cancelled and allocation released`); return false;
    } });
};
A.dispatchOrder = d => {
  const o = order(d.id), p = product(o.productId), rem = outstandingQty(o);
  formModal({ title: `Record dispatch — ${o.id}`, submitLabel: 'Record dispatch', body: `
    <p>${esc(p.name)} to <strong>${esc(o.customer.name)}</strong>, ${esc(o.customer.address)}<br><span class="small muted">${rem} of ${o.qty} still to ship.</span></p>
    <div class="form-grid">
      ${field('carrier', 'Carrier', sel('carrier', ['DPD', 'Royal Mail Tracked 48', 'Parcelforce Worldwide', 'DHL Parcel UK', 'Palletways'].map(c => `<option>${c}</option>`).join('')))}
      ${field('tracking', 'Tracking number', inp('tracking', 'text', '', 'placeholder="e.g. DPD15512345678"'))}
      ${field('date', 'Dispatch date', inp('date', 'date', todayISO(), `max="${todayISO()}"`))}
      ${field('qty', 'Quantity shipped', inp('qty', 'number', rem, `min="1" max="${rem}"`), rem > 1 ? 'Ship fewer for a partial dispatch.' : '')}
    </div>
    <p class="small muted">Physical warehouse stock reduces by the quantity shipped. The partner\'s allocation is not topped up automatically.</p>`,
    onSubmit: (form, v) => {
      if (!validate(form, [['tracking', x => x.length >= 6 || 'Enter the full tracking number.'], ['date', x => x && x <= todayISO() || 'Dispatch date cannot be in the future.'], ['qty', x => !posInt(x) ? 'Enter a whole number above zero.' : +x > rem ? `Only ${rem} left to ship on this order.` : +x > p.physical - p.damaged ? 'Not enough sellable physical stock.' : true]])) return false;
      const q = +v.qty;
      o.dispatches.push({ id: o.id + '-D' + (o.dispatches.length + 1), date: v.date, carrier: v.carrier, tracking: v.tracking.trim().toUpperCase(), qty: q });
      p.physical -= q; o.status = dispatchedQty(o) >= o.qty ? 'Dispatched' : 'Partially Dispatched'; if (!o.approvedAt) o.approvedAt = todayISO();
      orderLog(o, `Dispatched ${q} via ${v.carrier} (${v.tracking.trim().toUpperCase()})`);
      movement(p.id, 'Dispatched', -q, `${o.id} · ${v.carrier} ${v.tracking.trim().toUpperCase()}`);
      audit('Dispatch recorded', `${o.id} · ${v.carrier} ${v.tracking.trim().toUpperCase()} · ${q} unit${q > 1 ? 's' : ''}`);
      notify(o.partnerId, `Tracking added for ${o.ref}: ${v.carrier} ${v.tracking.trim().toUpperCase()}${o.status === 'Partially Dispatched' ? ' (partial shipment)' : ''}`, { page: 'orders' });
      closeAllModals(); commit(o.status === 'Dispatched' ? `${o.id} dispatched — ready to invoice` : `Partial dispatch recorded for ${o.id}`); return false;
    } });
};

ADMIN_PAGES.dispatches = () => {
  const ready = S.orders.filter(o => ['Awaiting Dispatch', 'Partially Dispatched'].includes(o.status)).sort((a, b) => a.date.localeCompare(b.date));
  const all = S.orders.flatMap(o => o.dispatches.map(d => ({ o, d }))).sort((a, b) => b.d.date.localeCompare(a.d.date));
  const tb = tabs('disp', [['ready', 'Ready to dispatch', ready.length], ['hist', 'Dispatch history', all.length]]);
  const q = fval('dispQ');
  return `<div class="page-head"><div><h1>Dispatches</h1><p>Approved orders waiting to leave the warehouse, and every shipment recorded so far.</p></div></div>${tb.html}
  ${tb.cur === 'ready' ? `<section class="panel">${table([
    { h: 'Order', v: o => `<span class="cell-strong">${o.id}</span><span class="cell-sub">${esc(o.ref)}</span>` }, { h: 'Partner', v: o => esc(partner(o.partnerId).name) },
    { h: 'Product', v: o => esc(product(o.productId).name) }, { h: 'To ship', num: 1, v: o => `<strong>${outstandingQty(o)}</strong> of ${o.qty}` },
    { h: 'Deliver to', v: o => `${esc(o.customer.name)}<span class="cell-sub">${esc(o.customer.address)}</span>` }, { h: 'Approved', v: o => fmtDate(o.approvedAt) + (o.override ? ' <span class="badge b-navy">Override</span>' : '') }, { h: 'Status', v: o => badge(o.status) },
    { h: '', v: o => `<div class="actions"><button class="btn sm primary" data-act="dispatchOrder" data-id="${o.id}">Record dispatch</button></div>` }], ready, 'Nothing waiting to dispatch. Approved orders appear here.')}</section>`
    : `<section class="panel"><div class="toolbar">${searchBox('dispQ', 'Search tracking, order or customer')}</div>${table([
    { h: 'Date', v: x => fmtDate(x.d.date) }, { h: 'Order', v: x => `<button class="link-btn" data-act="viewOrder" data-id="${x.o.id}">${x.o.id}</button>` }, { h: 'Partner', v: x => esc(partner(x.o.partnerId).name) },
    { h: 'Product', v: x => esc(product(x.o.productId).name) }, { h: 'Carrier', v: x => esc(x.d.carrier) }, { h: 'Tracking', v: x => `<strong>${esc(x.d.tracking)}</strong>` }, { h: 'Qty', num: 1, v: x => x.d.qty }],
    all.filter(x => matches(q, x.d.tracking, x.o.id, x.o.ref, x.o.customer.name)))}</section>`}`;
};

/* ---------- Invoices ---------- */
function invoicesTable(rows) {
  return table([
    { h: 'Invoice', v: i => `<span class="cell-strong">${i.number}</span><span class="cell-sub">${i.orderIds.length} order${i.orderIds.length > 1 ? 's' : ''}</span>` },
    ...(isAdmin() ? [{ h: 'Partner', v: i => esc(partner(i.partnerId).name) }] : []),
    { h: 'Invoice date', v: i => fmtDate(i.date) }, { h: 'Due', v: i => fmtDate(i.due) },
    { h: 'Total', num: 1, v: i => money(i.total) }, { h: 'Paid / credited', num: 1, v: i => money(invPaid(i) + invCredited(i)) }, { h: 'Balance', num: 1, v: i => `<strong>${money(invBalance(i))}</strong>` },
    { h: 'Status', v: i => badge(invStatus(i)) },
    ...(isAdmin() ? [{ h: 'Xero', v: i => i.xero.number ? `<span class="small">${esc(i.xero.number)}</span>` : '<span class="muted small">Not linked</span>' }] : []),
    { h: '', v: i => `<div class="actions"><button class="btn sm" data-act="viewInvoice" data-id="${i.id}">View</button>${isAdmin() && invBalance(i) > 0 ? `<button class="btn sm primary" data-act="recordPayment" data-id="${i.id}">Record payment</button>` : ''}</div>` }
  ], rows, 'No invoices yet.');
}
ADMIN_PAGES.invoices = () => {
  const eligible = S.orders.filter(o => o.status === 'Dispatched' && !o.invoiceId);
  const tb = tabs('inv', [['list', 'Invoices', S.invoices.length], ['create', 'Create invoice', eligible.length]]);
  let body;
  if (tb.cur === 'list') {
    const pf = fval('invPartner'), sf = fval('invStatus'), q = fval('invQ');
    const rows = S.invoices.filter(i => (!pf || i.partnerId === pf) && (!sf || invStatus(i) === sf) && matches(q, i.number, i.xero.number, ...i.orderIds)).sort((a, b) => b.date.localeCompare(a.date));
    body = `<section class="panel"><div class="toolbar">${searchBox('invQ', 'Search invoice, order or Xero ref')}${selectFilter('invPartner', 'Partner', partnerOpts())}${selectFilter('invStatus', 'Status', [['', 'All statuses'], ...['Issued', 'Partially Paid', 'Paid', 'Overdue', 'Credited'].map(s => [s, s])])}<span class="grow"></span><button class="btn" data-act="exportInvoices">${icon('download')}Export CSV</button></div>${invoicesTable(rows)}</section>`;
  } else {
    const pf = fval('ciPartner');
    const rows = eligible.filter(o => !pf || o.partnerId === pf);
    const selIds = [...UI.selectedOrders].filter(id => eligible.some(o => o.id === id));
    const selPartner = selIds.length ? order(selIds[0]).partnerId : null;
    const selTotal = sum(selIds, id => orderMoney(order(id), dispatchedQty(order(id))).payable);
    body = `${callout('info', 'Select one dispatched order for a single invoice, or several orders from the <strong>same partner</strong> for a consolidated invoice. An order can only be invoiced once; use a credit note for adjustments.')}
    <section class="panel mt"><div class="toolbar">${selectFilter('ciPartner', 'Partner', partnerOpts())}<span class="grow"></span><span class="small">${selIds.length ? `<strong>${selIds.length}</strong> selected · ${esc(partner(selPartner).name)} · est. ${money(selTotal)}` : 'No orders selected'}</span>
      <button class="btn" data-act="clearSel" ${selIds.length ? '' : 'disabled'}>Clear</button><button class="btn primary" data-act="previewInvoice" ${selIds.length ? '' : 'disabled'}>${icon('invoice')}Preview invoice</button></div>
    ${table([
      { h: '<span class="sr-only">Select</span>', v: o => `<input type="checkbox" data-change="toggleSel" data-id="${o.id}" ${UI.selectedOrders.has(o.id) ? 'checked' : ''} ${selPartner && selPartner !== o.partnerId ? 'disabled title="Different partner"' : ''} aria-label="Select ${o.id}">` },
      { h: 'Order', v: o => `<span class="cell-strong">${o.id}</span><span class="cell-sub">${esc(o.ref)}</span>` }, { h: 'Partner', v: o => esc(partner(o.partnerId).name) },
      { h: 'Product', v: o => esc(product(o.productId).name) }, { h: 'Qty dispatched', num: 1, v: o => dispatchedQty(o) },
      { h: 'Dispatched', v: o => fmtDate(o.dispatches[o.dispatches.length - 1].date) }, { h: 'Est. payable', num: 1, v: o => money(orderMoney(o, dispatchedQty(o)).payable) }
    ], rows, 'No dispatched orders are waiting to be invoiced.')}</section>`;
  }
  return `<div class="page-head"><div><h1>Invoices</h1><p>Invoice records for monthly settlement. Partners pay by bank transfer outside the portal; payments are recorded here. ${demoTag('Demo values')}</p></div></div>${tb.html}${body}`;
};
A.exportInvoices = () => downloadCSV(`invoices-${todayISO()}.csv`, [['Invoice', 'Partner', 'Orders', 'Date', 'Due', 'Total', 'Paid', 'Credited', 'Balance', 'Status', 'Xero number'],
  ...S.invoices.filter(i => isAdmin() || i.partnerId === S.session.partnerId).map(i => [i.number, partner(i.partnerId).name, i.orderIds.join(' '), i.date, i.due, i.total, invPaid(i), invCredited(i), invBalance(i), invStatus(i), i.xero.number])]);
A.toggleSel = (d, el) => {
  const o = order(d.id);
  if (el.checked) { const first = [...UI.selectedOrders][0]; if (first && order(first).partnerId !== o.partnerId) { el.checked = false; return toast('A consolidated invoice can only include orders from one partner.', 'error'); } UI.selectedOrders.add(d.id); }
  else UI.selectedOrders.delete(d.id);
  render();
};
A.clearSel = () => { UI.selectedOrders.clear(); render(); };
A.invoiceFromOrder = d => { closeAllModals(); UI.selectedOrders = new Set([d.id]); UI.page = 'invoices'; UI.tab.inv = 'create'; render(); A.previewInvoice(); };
A.previewInvoice = () => {
  const ids = [...UI.selectedOrders].filter(id => { const o = order(id); return o && o.status === 'Dispatched' && !o.invoiceId; });
  if (!ids.length) return toast('Select at least one dispatched, uninvoiced order.', 'error');
  const pid = order(ids[0]).partnerId; if (ids.some(id => order(id).partnerId !== pid)) return toast('All orders must belong to the same partner.', 'error');
  const date = todayISO(), due = addDays(date, partner(pid).paymentDays);
  const draft = buildInvoice(S, pid, ids, date, due); draft.number = 'INV-2026-' + String(S.settings.nextInvoiceNo).padStart(4, '0') + ' (draft)';
  const w = openModal({ title: `Preview ${ids.length > 1 ? 'consolidated ' : ''}invoice`, size: 'xl', body: `
    <div class="form-grid"><div class="field"><label for="pvDate">Invoice date</label><input type="date" id="pvDate" value="${date}"></div><div class="field"><label for="pvDue">Due date</label><input type="date" id="pvDue" value="${due}"><div class="hint">Default: ${partner(pid).paymentDays} days (partner terms)</div><div class="err"></div></div></div>
    <div id="pvDoc">${invoiceDoc(draft)}</div>`,
    foot: `<button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" id="pvCreate">${icon('check')}Create invoice record</button>` });
  w.querySelector('#pvDate').addEventListener('change', e => { const d2 = e.target.value; if (!d2) return; w.querySelector('#pvDue').value = addDays(d2, partner(pid).paymentDays); });
  w.querySelector('#pvCreate').addEventListener('click', () => {
    const d1 = w.querySelector('#pvDate').value, d2 = w.querySelector('#pvDue').value;
    if (!d1 || !d2 || d2 < d1) { const f = w.querySelector('#pvDue').closest('.field'); f.classList.add('invalid'); f.querySelector('.err').textContent = 'Due date must be on or after the invoice date.'; return; }
    if (ids.some(id => order(id).invoiceId)) return toast('One of these orders has already been invoiced.', 'error');
    const inv = buildInvoice(S, pid, ids, d1, d2); inv.id = inv.number = 'INV-2026-' + String(S.settings.nextInvoiceNo++).padStart(4, '0');
    S.invoices.push(inv); ids.forEach(id => { order(id).invoiceId = inv.id; orderLog(order(id), 'Included on invoice ' + inv.id); });
    audit('Invoice created', `${inv.id} for ${partner(pid).name} — ${ids.join(', ')} — ${money(inv.total)}`);
    notify(pid, `Invoice ${inv.id} issued for ${money(inv.total)} — due ${fmtDate(inv.due)}`, { page: 'billing' });
    UI.selectedOrders.clear(); UI.tab.inv = 'list'; closeAllModals(); commit(`${inv.id} created (status: Issued)`); A.viewInvoice({ id: inv.id });
  });
};

function invoiceDoc(inv) {
  const p = partner(inv.partnerId), gross = inv.treatment === 'gross';
  const st = inv.id ? invStatus(inv) : 'Draft';
  return `<div class="doc"><div class="doc-head"><img src="${LOGO}" alt="Trend Tents"><div class="t"><h2>Invoice</h2><div>${esc(inv.number)}</div></div></div><div class="doc-stripe"></div>
  <div class="doc-body">
    <div class="doc-parties">
      <div><h4>From</h4><strong>Trend Tents Ltd</strong><br>Unit 12, Riverside Business Park<br>Leeds LS10 1AB (sample)<br>accounts@trendtents.example</div>
      <div><h4>Bill to</h4><strong>${esc(p.name)}</strong><br>${esc(p.contact)}<br>${esc(p.address)}<br>${esc(p.email)}</div>
      <div><h4>Details</h4>Invoice date: <strong>${fmtDate(inv.date)}</strong><br>Due date: <strong>${fmtDate(inv.due)}</strong><br>Terms: monthly settlement, ${p.paymentDays} days<br>Status: ${st === 'Draft' ? '<span class="badge">Draft</span>' : badge(st)}</div>

/* ---------- Settlement statements ---------- */
function recentMonths(n) { const out = []; const d = new Date(); d.setDate(15); for (let i = 0; i < n; i++) { out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); d.setMonth(d.getMonth() - 1); } return out; }
function statement(pid, mk) {
  const p = partner(pid), start = mk + '-01';
  const endD = new Date(start + 'T12:00:00'); endD.setMonth(endD.getMonth() + 1); endD.setDate(0);
  const end = addDays(start, endD.getDate() - 1);
  const inP = x => x >= start && x <= end, before = x => x < start;
  const invs = S.invoices.filter(i => i.partnerId === pid), pays = S.payments.filter(x => x.partnerId === pid), crs = S.credits.filter(c => c.partnerId === pid);
  const opening = round2(sum(invs.filter(i => before(i.date)), i => i.total) - sum(pays.filter(x => before(x.date)), x => x.amount) - sum(crs.filter(c => before(c.date)), c => c.amount));
  const lines = [];
  S.orders.filter(o => o.partnerId === pid).forEach(o => o.dispatches.forEach((dp, i) => { if (inP(dp.date)) { const value = round2(o.unitPrice * dp.qty), commission = round2(value * o.commissionRate / 100), shipping = i === 0 ? S.settings.shippingPerOrder : 0; const sub = value - commission + shipping; const vat = S.settings.vatEnabled ? round2(sub * S.settings.vatRate / 100) : 0; lines.push({ date: dp.date, o, qty: dp.qty, value, commission, shipping, vat, payable: round2(sub + vat), invoice: o.invoiceId }); } }));
  lines.sort((a, b) => a.date.localeCompare(b.date));
  const issued = invs.filter(i => inP(i.date)), paid = pays.filter(x => inP(x.date)), credited = crs.filter(c => inP(c.date));
  const invoicedTotal = round2(sum(issued, i => i.total)), paymentsTotal = round2(sum(paid, x => x.amount)), creditsTotal = round2(sum(credited, c => c.amount));
  const closing = round2(opening + invoicedTotal - creditsTotal - paymentsTotal);
  // statement issued on the partner's statement day of the following month
  const sd = new Date(end + 'T12:00:00'); sd.setDate(sd.getDate() + p.statementDay);
  const stmtDate = sd.toISOString().slice(0, 10);
  const openDue = invs.filter(i => i.date <= end && invBalance(i) > 0).map(i => i.due).sort()[0];
  return { p, mk, start, end, opening, lines, issued, paid, credited, invoicedTotal, paymentsTotal, creditsTotal, closing, stmtDate, due: openDue || addDays(stmtDate, p.paymentDays),
    totals: { value: sum(lines, l => l.value), commission: sum(lines, l => l.commission), shipping: sum(lines, l => l.shipping), vat: sum(lines, l => l.vat), payable: sum(lines, l => l.payable) } };
}
