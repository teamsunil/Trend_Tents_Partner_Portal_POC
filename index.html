      <div class="field"><label class="check"><input type="checkbox" name="confirm"> I confirm the goods are physically received and checked into the warehouse.</label><div class="err"></div></div></div>
    ${field('adminNote', 'Note to partner (optional)', inp('adminNote', 'text', ''))}`,
    onMount: form => { const upd = () => { const s = form.elements.status.value; form.querySelector('#rpEta').hidden = !['Confirmed for Shipment', 'In Transit'].includes(s); form.querySelector('#rpRecv').hidden = s !== 'Received'; }; form.elements.status.addEventListener('change', upd); upd(); },
    onSubmit: (form, v) => {
      const s = v.status;
      const rules = [];
      if (['Confirmed for Shipment', 'In Transit'].includes(s)) rules.push(['eta', req, 'Enter an expected arrival date.']);
      if (s === 'Received') rules.push(['recvQty', posInt, 'Enter the quantity received.'], ['confirm', (x, el) => el.checked, 'Confirm warehouse receipt before stock is added.']);
      if (!validate(form, rules)) return false;
      const wasCounted = r.incomingCounted;
      if (['Confirmed for Shipment', 'In Transit'].includes(s)) { if (!wasCounted) { p.incoming += r.qty; r.incomingCounted = true; } r.eta = v.eta; if (!p.incomingDate || v.eta < p.incomingDate || p.incomingDate < todayISO()) p.incomingDate = v.eta; }
      if (s === 'Received') {
        const q = +v.recvQty; p.physical += q; r.receivedQty = q;
        if (wasCounted) { p.incoming = Math.max(0, p.incoming - r.qty); r.incomingCounted = false; if (!p.incoming) p.incomingDate = ''; }
        if (p.status === 'Awaiting Receipt') p.status = 'Available';
        movement(p.id, 'Stock received', q, `Replenishment ${r.id} — receipt confirmed`);
        if (v.allocate) doAllocate(r.partnerId, p.id, q, 'replenishment ' + r.id);
      }
      if (s === 'Cancelled' && wasCounted) { p.incoming = Math.max(0, p.incoming - r.qty); r.incomingCounted = false; if (!p.incoming) p.incomingDate = ''; }
      r.status = s; if (v.adminNote) r.adminNote = v.adminNote.trim();
      audit('Replenishment updated', `${r.id} → ${s}`); notify(r.partnerId, `Replenishment ${r.id} is now ${s}${r.eta && s !== 'Received' && s !== 'Cancelled' ? ' (ETA ' + fmtDate(r.eta) + ')' : ''}`, { page: 'replenishment' });
      closeModal(); commit(`${r.id} updated to ${s}`); return false;
    } });
};

/* ---------- Returns & refunds ---------- */
function returnsTable(rows, admin) {
  return table([
    { h: 'Return', v: r => `<span class="cell-strong">${r.id}</span><span class="cell-sub">${fmtDate(r.date)}</span>` },
    ...(admin ? [{ h: 'Partner', v: r => esc(partner(r.partnerId).name) }] : []),
    { h: 'Order', v: r => `${r.orderId}<span class="cell-sub">${esc(order(r.orderId).ref)}</span>` }, { h: 'Product', v: r => `${esc(product(r.productId).name)}<span class="cell-sub">Qty ${r.qty}</span>` },
    { h: 'Reason', v: r => `<span class="small">${esc(r.reason)}</span>` }, { h: 'Partner credit', num: 1, v: r => r.partnerCredit != null ? money(r.partnerCredit) : '—' },
    { h: 'Status', v: r => badge(r.status) },
    { h: '', v: r => `<div class="actions"><button class="btn sm ${admin && !['Completed', 'Rejected'].includes(r.status) ? 'primary' : ''}" data-act="viewReturn" data-id="${r.id}">${admin && !['Completed', 'Rejected'].includes(r.status) ? 'Review' : 'View'}</button></div>` }
  ], rows, admin ? 'No return requests.' : 'No return requests yet.');
}
ADMIN_PAGES.returns = () => {
  const sf = fval('rtStatus');
  const rows = S.returns.filter(r => !sf || r.status === sf).sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="page-head"><div><h1>Returns & Refunds</h1><p>Returned stock is only sellable after physical receipt and inspection. The partner refunds its own customer; any credit from Trend Tents to the partner is recorded separately.</p></div></div>
  <section class="panel"><div class="toolbar">${selectFilter('rtStatus', 'Status', [['', 'All statuses'], ...['Submitted', 'Return Approved', 'Return In Transit', 'Inspected', 'Completed', 'Rejected'].map(s => [s, s])])}</div>${returnsTable(rows, true)}</section>`;
};
A.viewReturn = d => {
  const r = S.returns.find(x => x.id === d.id), o = order(r.orderId), adm = isAdmin();
  const flow = ['Submitted', 'Return Approved', 'Return In Transit', 'Inspected', 'Completed'];
  const idx = flow.indexOf(r.status);
  let actions = '';
  if (adm && r.status === 'Submitted') actions = `<button class="btn danger" data-act="returnReject" data-id="${r.id}">Reject</button><button class="btn primary" data-act="returnApprove" data-id="${r.id}">Approve return</button>`;
  if (adm && r.status === 'Return Approved') actions = `<button class="btn primary" data-act="returnTracking" data-id="${r.id}">Record return tracking</button>`;
  if (adm && r.status === 'Return In Transit') actions = `<button class="btn primary" data-act="returnInspect" data-id="${r.id}">Record receipt & inspection</button>`;
  if (adm && r.status === 'Inspected') actions = `<button class="btn primary" data-act="returnCredit" data-id="${r.id}">Record refund / credit</button>`;
  openModal({ title: `Return ${r.id} ${badge(r.status)}`, size: 'lg', body: `
    <div class="grid g2"><div><dl class="dl"><dt>Partner</dt><dd>${esc(partner(r.partnerId).name)}</dd><dt>Original order</dt><dd>${o.id} (${esc(o.ref)})</dd><dt>Customer</dt><dd>${esc(o.customer.name)}</dd><dt>Product</dt><dd>${esc(product(r.productId).name)} × ${r.qty}</dd><dt>Reason</dt><dd>${esc(r.reason)}</dd><dt>Notes</dt><dd>${esc(r.notes || '—')}</dd><dt>Evidence</dt><dd>${esc(r.evidence || 'None attached')}</dd></dl></div>
    <div><ul class="timeline">${(r.status === 'Rejected' ? ['Submitted', 'Rejected'] : flow).map((s, i) => `<li class="${r.status === 'Rejected' || i <= idx ? 'done' : ''}"><strong>${s}</strong></li>`).join('')}</ul></div></div>
    ${r.status === 'Rejected' ? callout('bad', `Rejected: ${esc(r.decisionNote)}`) : ''}
    ${r.shippingResp || r.tracking || r.inspection || r.partnerCredit != null ? `<h3 class="mt mb">Processing record</h3><dl class="dl">
      ${r.shippingResp ? `<dt>Return shipping paid by</dt><dd>${esc(r.shippingResp)}</dd>` : ''}${r.tracking ? `<dt>Return tracking</dt><dd>${esc(r.tracking)}</dd>` : ''}
      ${r.inspection ? `<dt>Inspection</dt><dd>${esc(r.inspection.result)} — ${esc(r.inspection.notes)} (${fmtDate(r.inspection.date)})</dd>` : ''}
      ${r.customerRefund != null ? `<dt>Customer refund (by partner)</dt><dd>${money(r.customerRefund)} — paid by the partner to its customer</dd>` : ''}
      ${r.partnerCredit != null ? `<dt>Credit to partner (from Trend Tents)</dt><dd>${money(r.partnerCredit)}${r.creditId ? ' · ' + r.creditId : ''}</dd><dt>Commission adjustment</dt><dd>${money(r.commissionAdj || 0)}</dd>` : ''}</dl>` : ''}
    ${callout('demo', 'Customer refunds are handled by the partner through its own payment arrangements. Any credit or refund owed by Trend Tents to the partner is recorded separately on the partner\'s account.')}`,
    foot: `<button class="btn" data-act="closeModal">Close</button>${actions}` });
};
A.returnApprove = d => {
  const r = S.returns.find(x => x.id === d.id);
  formModal({ title: `Approve return ${r.id}`, submitLabel: 'Approve return', body: `${field('shippingResp', 'Who pays for return shipping?', sel('shippingResp', ['Trend Tents', 'Partner', 'Customer'].map(s => `<option>${s}</option>`).join('')), 'e.g. Trend Tents for transit damage, customer for change of mind')}${field('note', 'Instructions for the partner', ta('note', 'Please ask the customer to return the item in its original packaging to: Trend Tents Returns, Unit 12, Riverside Business Park, Leeds LS10 1AB (sample).'))}`,
    onSubmit: (form, v) => { r.status = 'Return Approved'; r.shippingResp = v.shippingResp; r.decisionNote = v.note; audit('Return approved', `${r.id} — return shipping: ${v.shippingResp}`); notify(r.partnerId, `Return ${r.id} approved. ${v.note}`, { page: 'returns' }); closeAllModals(); commit('Return approved'); return false; } });
};
A.returnReject = d => {
  const r = S.returns.find(x => x.id === d.id);
  formModal({ title: `Reject return ${r.id}`, submitLabel: 'Reject return', danger: true, body: field('note', 'Reason shown to partner', ta('note')),
    onSubmit: (form, v) => { if (!validate(form, [['note', req, 'Give a reason.']])) return false; r.status = 'Rejected'; r.decisionNote = v.note.trim(); audit('Return rejected', `${r.id}: ${r.decisionNote}`); notify(r.partnerId, `Return ${r.id} was rejected: ${r.decisionNote}`, { page: 'returns' }); closeAllModals(); commit('Return rejected'); return false; } });
};
A.returnTracking = d => {
  const r = S.returns.find(x => x.id === d.id);
  formModal({ title: 'Record return tracking', submitLabel: 'Save tracking', body: `<div class="form-grid">${field('carrier', 'Carrier', sel('carrier', ['DPD', 'Royal Mail Tracked 48', 'Parcelforce Worldwide', 'Customer drop-off'].map(c => `<option>${c}</option>`).join('')))}${field('tracking', 'Tracking number', inp('tracking'))}</div>`,
    onSubmit: (form, v) => { if (!validate(form, [['tracking', req, 'Enter the tracking number.']])) return false; r.status = 'Return In Transit'; r.tracking = v.carrier + ' ' + v.tracking.trim().toUpperCase(); audit('Return tracking recorded', `${r.id} · ${r.tracking}`); notify(r.partnerId, `Return ${r.id} is in transit (${r.tracking})`, { page: 'returns' }); closeAllModals(); commit('Return tracking saved'); return false; } });
};
A.returnInspect = d => {
  const r = S.returns.find(x => x.id === d.id), p = product(r.productId);
  formModal({ title: 'Record receipt & inspection', submitLabel: 'Record inspection', body: `<p>${r.qty} × ${esc(p.name)} returned against ${r.orderId}.</p>
    ${field('result', 'Inspection result', sel('result', '<option value="Sellable">Sellable — return to available stock</option><option value="Unsellable">Unsellable — hold as damaged</option>'))}
    ${field('notes', 'Inspection notes', ta('notes', '', 'placeholder="e.g. Door zip torn; canvas otherwise intact"'))}
    <div class="field"><label class="check"><input type="checkbox" name="confirm"> Goods physically received at the warehouse and inspection approved.</label><div class="err"></div></div>
    <p class="small muted">Returned units go back into physical stock. They are not added to the partner's allocation.</p>`,
    onSubmit: (form, v) => {
      if (!validate(form, [['notes', req, 'Add inspection notes.'], ['confirm', (x, el) => el.checked, 'Confirm receipt and inspection approval.']])) return false;
      p.physical += r.qty; if (v.result === 'Unsellable') p.damaged += r.qty;
      movement(p.id, v.result === 'Sellable' ? 'Return received (sellable)' : 'Return received (unsellable)', r.qty, `${r.id} — ${v.notes}`);
      r.status = 'Inspected'; r.inspection = { result: v.result, notes: v.notes.trim(), date: todayISO() };
      audit('Return inspected', `${r.id}: ${v.result}`); closeAllModals(); commit(`Return inspected — ${r.qty} unit${r.qty > 1 ? 's' : ''} ${v.result === 'Sellable' ? 'back in sellable stock' : 'held as unsellable'}`); return false;
    } });
};
A.returnCredit = d => {
  const r = S.returns.find(x => x.id === d.id), o = order(r.orderId), m = orderMoney(o, r.qty);
  const suggested = round2(m.payable - (S.settings.vatEnabled ? m.shipping * (1 + S.settings.vatRate / 100) : m.shipping));
  formModal({ title: 'Record refund / credit', submitLabel: 'Record and complete', body: `
    ${callout('info', 'Keep the two amounts separate: the partner refunds its own customer; Trend Tents credits the partner for amounts it had invoiced.')}
    <div class="form-grid mt">${field('customerRefund', 'Customer refund paid by partner (£)', inp('customerRefund', 'number', round2(o.unitPrice * r.qty).toFixed(2), 'min="0" step="0.01"'), 'For the record only — not a Trend Tents payment')}
    ${field('partnerCredit', 'Credit owed to partner by Trend Tents (£)', inp('partnerCredit', 'number', suggested.toFixed(2), 'min="0" step="0.01"'), `Suggested: invoiced amount for ${r.qty} unit${r.qty > 1 ? 's' : ''} excluding shipping`)}
    ${field('commissionAdj', 'Commission adjustment (£)', inp('commissionAdj', 'number', (-m.commission).toFixed(2), 'step="0.01"'), 'Commission reversed on the returned unit(s)')}</div>
    <p class="small muted">${o.invoiceId && invBalance(invoice(o.invoiceId)) > 0 ? `The credit will be applied to ${o.invoiceId} (balance ${money(invBalance(invoice(o.invoiceId)))}); any excess stays on account.` : 'The credit will be held on the partner\'s account and shown on the monthly statement.'}</p>`,
    onSubmit: (form, v) => {
      if (!validate(form, [['customerRefund', x => x !== '' && +x >= 0, 'Enter £0 or more.'], ['partnerCredit', x => x !== '' && +x >= 0, 'Enter £0 or more.'], ['commissionAdj', x => x !== '', 'Enter an amount (can be £0).']])) return false;
      let amt = round2(v.partnerCredit); r.customerRefund = round2(v.customerRefund); r.partnerCredit = amt; r.commissionAdj = round2(v.commissionAdj);
      if (amt > 0) {
        const inv = o.invoiceId ? invoice(o.invoiceId) : null; const bal = inv ? Math.max(0, invBalance(inv)) : 0;
        const onInv = Math.min(bal, amt), rest = round2(amt - onInv);
        if (onInv > 0) S.credits.push({ id: 'CN-' + String(S.credits.length + 101), invoiceId: inv.id, partnerId: r.partnerId, amount: round2(onInv), date: todayISO(), reason: 'Return ' + r.id });
        if (rest > 0) S.credits.push({ id: 'CN-' + String(S.credits.length + 101), invoiceId: null, partnerId: r.partnerId, amount: rest, date: todayISO(), reason: 'Return ' + r.id + ' (on account)' });
        r.creditId = S.credits.filter(c => c.reason.startsWith('Return ' + r.id)).map(c => c.id).join(', ');
      }
      r.status = 'Completed'; audit('Return refund/credit recorded', `${r.id}: partner credit ${money(amt)}, commission adj. ${money(r.commissionAdj)}`);
      notify(r.partnerId, `Return ${r.id} completed. Credit of ${money(amt)} recorded on your account.`, { page: 'returns' });
      closeAllModals(); commit('Return completed and credit recorded'); return false;
    } });
};

/* ---------- Reports ---------- */
ADMIN_PAGES.reports = () => {
  const tb = tabs('rep', [['stock', 'Stock position'], ['sales', 'Sales by partner'], ['ageing', 'Invoice ageing'], ['audit', 'Audit history', S.audit.length]]);
  let body = '';
  if (tb.cur === 'stock') {
    const max = Math.max(...S.products.map(p => p.physical), 1);
    body = panel('Stock position by product', `<div class="panel-body"><div class="bars">${S.products.map(p => { const s = productStats(p); return `<div class="bar-row"><span class="small">${esc(p.name.split('—')[0])}</span><div class="bar-track" role="img" aria-label="${p.physical} physical"><div style="display:flex;height:100%"><div class="bar-fill o" style="width:${(s.reserved + s.remainingAlloc) / max * 100}%"></div><div class="bar-fill" style="width:${s.unallocated / max * 100}%;background:#9FC2A9"></div><div class="bar-fill" style="width:${p.damaged / max * 100}%;background:var(--red)"></div></div></div><span class="small num">${p.physical} units</span></div>`; }).join('')}</div>
      <div class="legend"><span><i style="background:var(--orange)"></i>Allocated / reserved</span><span><i style="background:#9FC2A9"></i>Unallocated</span><span><i style="background:var(--red)"></i>Unsellable</span></div></div>`, `<button class="btn sm" data-act="exportStock">${icon('download')}Export CSV</button>`, true);
  }
  if (tb.cur === 'sales') {
    const rows = S.partners.map(p => { const os = S.orders.filter(o => o.partnerId === p.id && o.status !== 'Cancelled'); const units = sum(os, dispatchedQty); const value = sum(os, o => o.unitPrice * dispatchedQty(o)); const comm = sum(os, o => o.unitPrice * dispatchedQty(o) * o.commissionRate / 100); return { p, orders: os.length, units, value, comm }; });
    const max = Math.max(...rows.map(r => r.value), 1);
    body = panel('Dispatched sales by partner (all time, demo)', `<div class="panel-body"><div class="bars">${rows.map(r => `<div class="bar-row"><span class="small">${esc(r.p.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${r.value / max * 100}%"></div></div><span class="small num">${money(r.value)}</span></div>`).join('')}</div></div>
      ${table([{ h: 'Partner', v: r => esc(r.p.name) }, { h: 'Orders', num: 1, v: r => r.orders }, { h: 'Units dispatched', num: 1, v: r => r.units }, { h: 'Order value', num: 1, v: r => money(r.value) }, { h: 'Partner commission', num: 1, v: r => money(r.comm) }, { h: 'Outstanding', num: 1, v: r => money(partnerFinance(r.p.id).outstanding) }], rows)}`,
      `<button class="btn sm" data-act="exportSales">${icon('download')}Export CSV</button>`);
  }
  if (tb.cur === 'ageing') {
    const open = S.invoices.filter(i => invBalance(i) > 0);
    const bucket = i => { const late = daysBetween(i.due, todayISO()); return late <= 0 ? 'Not yet due' : late <= 30 ? '1–30 days overdue' : late <= 60 ? '31–60 days overdue' : '60+ days overdue'; };
    const names = ['Not yet due', '1–30 days overdue', '31–60 days overdue', '60+ days overdue'];
    body = `<div class="kpis">${names.map((n, i) => kpi(n, money(sum(open.filter(x => bucket(x) === n), invBalance)), open.filter(x => bucket(x) === n).length + ' invoices', i === 0 ? 'ok' : i === 1 ? 'warn' : 'bad')).join('')}</div>
    ${panel('Open invoices', table([{ h: 'Invoice', v: i => `<button class="link-btn" data-act="viewInvoice" data-id="${i.id}">${i.number}</button>` }, { h: 'Partner', v: i => esc(partner(i.partnerId).name) }, { h: 'Due', v: i => fmtDate(i.due) }, { h: 'Bucket', v: i => esc(bucket(i)) }, { h: 'Balance', num: 1, v: i => money(invBalance(i)) }, { h: 'Status', v: i => badge(invStatus(i)) }], open, 'No open invoices.'), `<button class="btn sm" data-act="exportInvoices">${icon('download')}Export CSV</button>`)}`;
  }
  if (tb.cur === 'audit') {
    const q = fval('audQ');
    const rows = S.audit.filter(a => matches(q, a.action, a.detail, a.user));
    body = `<section class="panel"><div class="toolbar">${searchBox('audQ', 'Search audit history')}<span class="grow"></span><button class="btn sm" data-act="exportAudit">${icon('download')}Export CSV</button></div>${table([{ h: 'When', v: a => fmtDateTime(a.at) }, { h: 'User', v: a => esc(a.user) }, { h: 'Action', v: a => `<strong>${esc(a.action)}</strong>` }, { h: 'Detail', v: a => `<span class="small">${esc(a.detail)}</span>` }], rows)}</section>`;
  }
  return `<div class="page-head"><div><h1>Reports</h1><p>Operational and financial summaries built from the demo data. ${demoTag()}</p></div></div>${tb.html}${body}`;
};
A.exportSales = () => downloadCSV(`sales-by-partner-${todayISO()}.csv`, [['Partner', 'Orders', 'Units dispatched', 'Order value', 'Commission', 'Outstanding'], ...S.partners.map(p => { const os = S.orders.filter(o => o.partnerId === p.id && o.status !== 'Cancelled'); return [p.name, os.length, sum(os, dispatchedQty), round2(sum(os, o => o.unitPrice * dispatchedQty(o))), round2(sum(os, o => o.unitPrice * dispatchedQty(o) * o.commissionRate / 100)), partnerFinance(p.id).outstanding]; })]);

function submitOrder(form) {
  const v = formData(form), pid = me().id;
  const s = allocStats(pid, v.productId);
  const ok = validate(form, [
    ['ref', x => !req(x) ? 'Enter your order reference.' : S.orders.some(o => o.partnerId === pid && o.status !== 'Cancelled' && o.ref.toLowerCase() === x.toLowerCase()) ? 'You have already submitted an order with this reference. Use a different reference to avoid a duplicate.' : true],
    ['qty', x => !posInt(x) ? 'Enter a whole number of 1 or more.' : +x > s.remaining ? `Only ${s.remaining} remaining in your allocation. Request more stock or reduce the quantity.` : true],
    ['custName', x => x.length >= 2 || 'Enter the customer\'s name.'], ['custAddress', x => x.length >= 10 || 'Enter the full delivery address including postcode.'],
    ['custPhone', x => /^[0-9 +()-]{10,}$/.test(x) || 'Enter a valid phone number.']
  ]);
  if (!ok) return;
  const btn = $('#orderSubmitBtn'); if (btn.disabled) return; btn.disabled = true;
  requireOtp(`fulfilment order ${v.ref.trim()}`, me().email, () => {
    // re-check at finalisation: guards against double submit and stale allocation
    const s2 = allocStats(pid, v.productId);
    if (S.orders.some(o => o.partnerId === pid && o.status !== 'Cancelled' && o.ref.toLowerCase() === v.ref.trim().toLowerCase())) { btn.disabled = false; return toast('This order reference was already submitted.', 'error'); }
    if (+v.qty > s2.remaining) { btn.disabled = false; return toast('Your remaining allocation changed. Please check the quantity.', 'error'); }
    const p = product(v.productId);
    const o = { id: 'O-' + S.settings.nextOrderNo++, ref: v.ref.trim(), partnerId: pid, productId: v.productId, qty: +v.qty, status: 'Pending Review', date: nowISO(), unitPrice: p.price, commissionRate: me().commission,
      customer: { name: v.custName.trim(), address: v.custAddress.trim().replace(/\s*\n\s*/g, ', '), phone: v.custPhone.trim() }, instructions: v.instructions.trim(), notes: v.notes.trim(), dispatches: [], invoiceId: null, history: [{ at: nowISO(), text: 'Submitted and verified by email OTP — ' + me().name }] };
    S.orders.push(o);
    const cc = creditCheck(o);
    if (cc.overLimit || cc.hasOverdue) o.flag = 'Credit review';
    audit('Order submitted', `${o.id} (${o.ref}) ${o.qty} × ${p.sku} — OTP verified${o.flag ? ' — flagged for credit review' : ''}`);
    notify('admin', `${me().name} submitted fulfilment order ${o.ref} (${o.qty} × ${p.name})${o.flag ? ' — flagged for credit review' : ''}`, { page: 'orders' });
    UI.filters.submitProduct = null; UI.page = 'orders'; save(); render();
    openModal({ title: 'Order submitted', body: `${callout('ok', `<strong>${o.id}</strong> (${esc(o.ref)}) is verified and with Trend Tents for review. ${o.qty} unit${o.qty > 1 ? 's' : ''} reserved from your allocation.`)}${o.flag ? '<div class="mt">' + callout('warn', 'Your account has an overdue balance or is over its credit limit, so this order is flagged for credit review.') + '</div>' : ''}<p class="mt small muted">You will see tracking here once it is dispatched.</p>`, foot: `<button class="btn primary" data-act="closeModal">Done</button>` });
  });
  // re-enable if the OTP modal is cancelled
  const watch = setInterval(() => { if (!document.querySelector('#otpIn')) { clearInterval(watch); const b = $('#orderSubmitBtn'); if (b) b.disabled = false; } }, 400);
}

      closeModal();
      requireOtp('replenishment request', me().email, () => {
        const r = { id: 'RP-' + (400 + S.replen.length + 1), partnerId: me().id, productId: v.productId, qty: +v.qty, preferredDate: v.preferredDate, notes: v.notes.trim(), status: 'Submitted', date: nowISO() };
        S.replen.push(r); audit('Replenishment requested', `${r.id}: ${r.qty} × ${product(r.productId).sku} (OTP verified)`);
        notify('admin', `${me().name} submitted replenishment request ${r.id} (${r.qty} × ${product(r.productId).name})`, { page: 'replenishment' });
        commit(`Replenishment request ${r.id} submitted`);
      });
      return false;
    } });
};

PARTNER_PAGES.returns = () => {
  const rows = S.returns.filter(r => r.partnerId === me().id).sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="page-head"><div><h1>Returns & Refunds</h1><p>Request a return against a dispatched order. You refund your customer through your own payment arrangements; any credit from Trend Tents appears on your statement.</p></div><button class="btn primary" data-act="newReturn" ${canTransact() ? '' : 'disabled'}>${icon('plus')}New return request</button></div>${suspendedNote()}
  <section class="panel">${returnsTable(rows, false)}</section>`;
};
A.newReturn = d => {
  const eligible = myOrders().filter(o => dispatchedQty(o) > 0);
  if (!eligible.length) return toast('You have no dispatched orders to return.', 'error');
  closeAllModals();
  const already = o => sum(S.returns.filter(r => r.orderId === o.id && r.status !== 'Rejected'), r => r.qty);
  formModal({ title: 'New return request', submitLabel: 'Submit return request', body: `<div class="form-grid">
    ${field('orderId', 'Original order', sel('orderId', eligible.map(o => `<option value="${o.id}" ${d.order === o.id ? 'selected' : ''}>${o.id} · ${esc(o.ref)} · ${esc(product(o.productId).name)} (${dispatchedQty(o) - already(o)} returnable)</option>`).join('')), '', 'full')}
    ${field('qty', 'Quantity', inp('qty', 'number', 1, 'min="1"'))}
    ${field('reason', 'Return reason', sel('reason', ['Damaged in transit', 'Faulty or missing parts', 'Wrong item sent', 'Customer changed mind', 'Other'].map(r => `<option>${r}</option>`).join('')))}
    ${field('evidence', 'Photo / evidence (placeholder)', '<input id="in-evidence" name="evidence" type="file" accept="image/*">', 'Only the file name is kept in this demo', 'full')}
    ${field('notes', 'Additional notes', ta('notes'), '', 'full')}</div>`,
    onSubmit: (form, v) => {
      const o = order(v.orderId), max = dispatchedQty(o) - already(o);
      if (!validate(form, [['qty', x => !posInt(x) ? 'Enter a whole number above zero.' : +x > max ? `Only ${max} unit${max === 1 ? '' : 's'} can be returned on this order.` : true], ['notes', x => x.length >= 5 || 'Describe the problem for Trend Tents.']])) return false;
      const file = form.elements.evidence.files[0];
      const r = { id: 'RT-' + (500 + S.returns.length + 1), partnerId: me().id, orderId: o.id, productId: o.productId, qty: +v.qty, reason: v.reason, notes: v.notes.trim(), evidence: file ? file.name + ' (placeholder — not uploaded)' : '', status: 'Submitted', date: nowISO() };
      S.returns.push(r); audit('Return requested', `${r.id} against ${o.id}: ${r.qty} × ${product(o.productId).sku} — ${r.reason}`);
      notify('admin', `${me().name} submitted return request ${r.id} for ${o.ref}`, { page: 'returns' });
      UI.page = 'returns'; closeModal(); commit(`Return request ${r.id} submitted`); return false;
    } });
};

PARTNER_PAGES.billing = () => {
  const f = partnerFinance(me().id);
  const tb = tabs('bill', [['inv', 'Invoices', f.invs.length], ['stmt', 'Monthly statements']]);
  let body;
  if (tb.cur === 'inv') body = `<section class="panel">${invoicesTable([...f.invs].sort((a, b) => b.date.localeCompare(a.date)))}</section>`;
  else {
    const months = recentMonths(6), mk = fval('pStMonth', months[0]); const s = statement(me().id, mk);
    body = `<section class="panel"><div class="panel-head"><div class="row">${selectFilter('pStMonth', 'Statement month', months.map(m => [m, monthLabel(m)]))}</div><div class="row"><button class="btn" data-act="stmtCSV" data-pid="${me().id}" data-month="${mk}">${icon('download')}Export CSV</button><button class="btn" data-act="stmtPrint" data-pid="${me().id}" data-month="${mk}">${icon('print')}Print</button></div></div><div class="panel-body">${statementDoc(s)}</div></section>`;
  }
  return `<div class="page-head"><div><h1>Invoices & Statements</h1><p>Monthly settlement: you pay Trend Tents by bank transfer, quoting the invoice number. Payments are recorded by Trend Tents. ${demoTag('Demo values')}</p></div></div>
  <div class="kpis">${kpi('Outstanding balance', money(f.outstanding), f.invs.filter(i => invBalance(i) > 0).length + ' unpaid invoices', '')}${kpi('Overdue', money(f.overdue), f.overdueInvs.length + ' invoices', f.overdue ? 'bad' : 'ok')}${kpi('Next payment due', f.nextDue ? fmtDate(f.nextDue) : '—', '', '')}${kpi('Available credit', money(f.available), 'Limit ' + money(f.limit), f.available < 0 ? 'bad' : 'ok')}</div>
  ${f.uninvoiced.length ? callout('info', `${f.uninvoiced.length} dispatched order${f.uninvoiced.length > 1 ? 's' : ''} (est. ${money(f.uninvoicedAmt)}) will appear on your next invoice.`) + '<div class="mt"></div>' : ''}
  ${tb.html}${body}`;
};

PARTNER_PAGES.notifications = () => {
  const ns = myNotifs();
  return `<div class="page-head"><div><h1>Notifications</h1><p>Updates about your orders, allocations, invoices and requests.</p></div><button class="btn" data-act="readAll">${icon('check')}Mark all as read</button></div>
  <section class="panel">${ns.length ? ns.map(n => `<button class="list-item ${n.read ? '' : 'unread'}" style="width:100%;border:0;border-bottom:1px solid var(--line-2);background:${n.read ? 'none' : ''};text-align:left;cursor:pointer" data-act="openNotif" data-id="${n.id}"><span class="pip ${n.read ? 'read' : ''}"></span><span>${esc(n.text)}</span><span class="when">${fmtDateTime(n.at)}</span></button>`).join('') : emptyState('bell', 'No notifications yet.')}</section>`;
};

PARTNER_PAGES.account = () => {
  const p = me();
  return `<div class="page-head"><div><h1>My Account</h1><p>Your company details and settlement terms. Contact Trend Tents to change them.</p></div></div>
  <div class="grid g3">
    <section class="panel panel-body"><h3 class="mb">Company</h3><dl class="dl"><dt>Business</dt><dd>${esc(p.name)}</dd><dt>Contact</dt><dd>${esc(p.contact)}</dd><dt>Email</dt><dd>${esc(p.email)}</dd><dt>Phone</dt><dd>${esc(p.phone)}</dd><dt>Address</dt><dd>${esc(p.address)}</dd><dt>Website</dt><dd>${esc(p.website)}</dd><dt>Status</dt><dd>${badge(p.status)}</dd></dl></section>
    <section class="panel panel-body"><h3 class="mb">Settlement terms ${demoTag('Demo values')}</h3><dl class="dl"><dt>Payment model</dt><dd>Monthly settlement</dd><dt>Payment method</dt><dd>Bank transfer (outside the portal)</dd><dt>Statement date</dt><dd>Day ${p.statementDay} of each month</dd><dt>Payment period</dt><dd>${p.paymentDays} days from invoice</dd><dt>Commission</dt><dd>${p.commission}%</dd><dt>Credit limit</dt><dd>${money(p.creditLimit)}</dd></dl></section>
    <section class="panel panel-body"><h3 class="mb">Security</h3><p class="small">Sensitive submissions — fulfilment orders, allocation requests and replenishment requests — are confirmed with a one-time code sent to <strong>${esc(p.email)}</strong>.</p>
      ${callout('demo', 'Demo sign-in has no password. In production, you set your own password via a single-use activation link, and codes are generated and checked on the server.')}</section>
  </div>`;
};

/* =====================================================================
   Walkthrough guide
   ===================================================================== */
const GUIDE = [
  ['Admin', 'Sign in as Admin and open the dashboard', { role: 'admin', page: 'dashboard' }],
  ['Admin', 'View warehouse stock (Bell Tent 5m: 100 physical) and partner allocations', { role: 'admin', page: 'products' }],
  ['Admin', 'Open ABC Camping\'s partner account', { role: 'admin', page: 'partnerDetail', detail: 'P-ABC' }],
  ['Partner', 'Switch to ABC Camping\'s partner view', { role: 'P-ABC', page: 'dashboard' }],
  ['Partner', 'View the catalogue — 10 Bell Tents remaining in allocation', { role: 'P-ABC', page: 'catalogue' }],
  ['Partner', 'Submit an order for one Bell Tent 5m (use "Fill with sample customer")', { role: 'P-ABC', page: 'submit', product: 'PR-BELL5' }],
  ['Partner', `Complete the simulated email OTP with code ${DEMO_OTP}`, null],
  ['Admin', 'Check the order in the Pending Review queue', { role: 'admin', page: 'orders', tab: ['orders', 'Pending Review'] }],
  ['Admin', 'Approve the order for dispatch', { role: 'admin', page: 'orders', tab: ['orders', 'Pending Review'] }],
  ['Admin', 'Record dispatch with carrier and tracking number', { role: 'admin', page: 'dispatches' }],
  ['Partner', 'See the order status and tracking as ABC Camping', { role: 'P-ABC', page: 'orders' }],
  ['Admin', 'Open the invoice module', { role: 'admin', page: 'invoices', tab: ['inv', 'create'] }],
  ['Admin', 'Select the order and create an invoice record', { role: 'admin', page: 'invoices', tab: ['inv', 'create'], filter: ['ciPartner', 'P-ABC'] }],
  ['Admin', 'Optionally select several ABC orders for a consolidated invoice', { role: 'admin', page: 'invoices', tab: ['inv', 'create'], filter: ['ciPartner', 'P-ABC'] }],
  ['Admin', 'Record a simulated bank-transfer payment on the invoice', { role: 'admin', page: 'invoices', tab: ['inv', 'list'], filter: ['invPartner', 'P-ABC'] }],
  ['Partner', 'Confirm the outstanding balance and invoice status changed', { role: 'P-ABC', page: 'billing' }],
  ['Admin', 'Open the monthly statement and check order, commission, charges and balance', { role: 'admin', page: 'settlements', filter: ['stPartner', 'P-ABC'] }],
  ['Partner', 'Test an allocation request and a replenishment request', { role: 'P-ABC', page: 'requeststock' }],
  ['Partner', 'Test a return / refund request', { role: 'P-ABC', page: 'returns' }]
];
function renderGuide() {
  return `<div class="modal-backdrop" style="background:rgba(21,33,45,.25);padding:0" data-act="closeGuide"></div><aside class="drawer" role="dialog" aria-label="Demo walkthrough">
    <div class="panel-head"><div><h2>Demo walkthrough</h2><div class="small muted">The seeded client scenario, step by step</div></div><button class="icon-btn" data-act="closeGuide" aria-label="Close walkthrough">${icon('x')}</button></div>
    <div class="scroll"><div style="padding:8px 20px 12px">${callout('demo', 'Each "Go" button switches to the right role and screen. Data changes carry across Admin and Partner views.')}</div>
    <ol class="steps">${GUIDE.map(([who, text, go], i) => `<li><div class="grow"><div class="who">${who}</div><div class="small">${esc(text)}</div></div>${go ? `<button class="btn sm" data-act="guideGo" data-i="${i}">Go</button>` : ''}</li>`).join('')}</ol>
    <div style="padding:16px 20px" class="small muted">Tip: reset demo data from the bar at the top to replay the scenario from the start.</div></div></aside>`;
}
A.guideGo = d => {
  const g = GUIDE[+d.i][2];
  if (g.role === 'admin') S.session.role = 'admin'; else { S.session.role = 'partner'; S.session.partnerId = g.role; }
  UI.page = g.page; if (g.detail) UI.detail = g.detail; if (g.tab) UI.tab[g.tab[0]] = g.tab[1]; if (g.filter) UI.filters[g.filter[0]] = g.filter[1]; if (g.product) UI.filters.submitProduct = g.product;
  if (g.page === 'partnerDetail') UI.tab.pd = 'overview';
  UI.guideOpen = false; UI.notifOpen = false; closeAllModals(); save(); render(); window.scrollTo(0, 0);
};

/* =====================================================================
   Global actions and event wiring
   ===================================================================== */
A.go = d => { UI.page = d.page; UI.navOpen = false; UI.notifOpen = false; closeAllModals(); render(); window.scrollTo(0, 0); };
A.tab = d => { UI.tab[d.key] = d.val; render(); };
A.login = d => { if (d.role === 'admin') S.session.role = 'admin'; else { S.session.role = 'partner'; S.session.partnerId = d.role; } UI.page = 'dashboard'; save(); render(); toast(`Signed in as ${isAdmin() ? 'Admin (demo)' : me().name + ' (demo)'}`); };
A.logout = () => { S.session.role = null; UI.notifOpen = false; save(); render(); };
A.toggleNav = () => { UI.navOpen = !UI.navOpen; render(); };
A.closeNav = () => { UI.navOpen = false; render(); };
A.toggleNotif = () => { UI.notifOpen = !UI.notifOpen; render(); };
A.readAll = () => { myNotifs().forEach(n => n.read = true); commit(); };
A.openNotif = d => { const n = S.notifications.find(x => x.id === d.id); n.read = true; UI.notifOpen = false; if (n.link && (isAdmin() ? ADMIN_PAGES : PARTNER_PAGES)[n.link.page]) UI.page = n.link.page; save(); render(); };
A.openGuide = () => { UI.guideOpen = true; render(); };
A.closeGuide = () => { UI.guideOpen = false; render(); };
A.closeModal = () => closeModal();
A.confirmReset = () => confirmBox('Reset demo data?', '<p>This restores the seeded scenario and clears every change made in this browser.</p>', 'Reset demo data', resetDemo, true);

const CHANGE = {
  switchRole: el => { const v = el.value; if (v === 'admin') S.session.role = 'admin'; else { S.session.role = 'partner'; S.session.partnerId = v; } UI.page = 'dashboard'; UI.notifOpen = false; save(); render(); toast(`Now viewing as ${isAdmin() ? 'Admin' : me().name}`); },
  toggleSel: el => A.toggleSel(el.dataset, el)
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (UI.notifOpen && !e.target.closest('.dropdown')) { UI.notifOpen = false; render(); } return; }
  if (el.tagName === 'INPUT') return; // inputs use change events
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); if (el.disabled) return; fn(el.dataset, el); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.change && CHANGE[el.dataset.change]) return CHANGE[el.dataset.change](el);
  if (el.dataset.filter && el.tagName === 'SELECT') { UI.filters[el.dataset.filter] = el.value; render(); }
  if (el.closest('#orderForm') && ['productId', 'qty'].includes(el.name)) { const f = el.form; $('#orderSummary').innerHTML = orderSummaryHTML(f.elements.productId.value, f.elements.qty.value); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.filter && el.tagName === 'INPUT') { UI.filters[el.dataset.filter] = el.value; render(); }
  if (el.closest('#orderForm') && el.name === 'qty') { const f = el.form; $('#orderSummary').innerHTML = orderSummaryHTML(f.elements.productId.value, f.elements.qty.value); }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.form === 'order') { e.preventDefault(); submitOrder(f); }
  if (f.dataset.form === 'settings') {
    e.preventDefault(); const v = formData(f);
    if (!validate(f, [['defaultCommission', x => x !== '' && +x >= 0 && +x <= 100, 'Enter 0–100.'], ['shippingPerOrder', x => x !== '' && +x >= 0, 'Enter £0 or more.'], ['vatRate', x => x !== '' && +x >= 0 && +x <= 100, 'Enter 0–100.']])) return;
    Object.assign(S.settings, { defaultCommission: +v.defaultCommission, shippingPerOrder: round2(v.shippingPerOrder), vatRate: +v.vatRate, vatEnabled: !!v.vatEnabled, treatment: v.treatment, creditBlock: !!v.creditBlock });
    audit('Settings updated', `Commission ${v.defaultCommission}%, shipping ${money(v.shippingPerOrder)}, VAT ${v.vatEnabled ? v.vatRate + '%' : 'off'}, ${v.treatment} treatment, credit block ${v.creditBlock ? 'on' : 'off'}`);
    commit('Settings saved');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (modalStack.length) closeModal(); else if (UI.guideOpen) A.closeGuide(); else if (UI.notifOpen) A.toggleNotif(); else if (UI.navOpen) A.closeNav(); }
});

load(); render();

</script>
</body>
</html>
